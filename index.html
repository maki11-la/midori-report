<style>
:root {
  --font: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
          "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --accent: #1c7a4a;
  --accent-soft: #e5f4eb;
  --bg: #f4f6f2;
  --bg-elev: #ffffff;
  --bg-sidebar: #eef2ea;
  --text: #1c1f1b;
  --text-dim: #5b6358;
  --line: #d5ddd0;
  --up: #c41a1a;
  --down: #1a7a3c;
  --fx: #9a6b12;
  --fx-bg: #f8efd6;
  --up-bg: #fdf0f0;
  --down-bg: #edf7f0;
  --bar-h: 64px;
  --concl-bg: #f3f8f0;
  --concl-border: #b9d4c0;
  --weekly: #6b4aa0;
  --weekly-bg: #f0eaf8;
  --daily: #1c7a4a;
  --daily-bg: #e5f4eb;
  --shadow: 0 1px 2px rgba(28,31,27,.06), 0 8px 24px rgba(28,31,27,.05);
  --header-h: 56px;
  --sidebar-w: 320px;
  --measure: 42rem;
  --radius: 12px;
  color-scheme: light;
}
html[data-theme="dark"] {
  --accent: #6dca8f;
  --accent-soft: #1a2b21;
  --bg: #121411;
  --bg-elev: #1a1d19;
  --bg-sidebar: #161915;
  --text: #e8ebe6;
  --text-dim: #9aa396;
  --line: #2c322c;
  --up: #ff6b6b;
  --down: #4ade80;
  --fx: #e0b44f;
  --fx-bg: #3a2f14;
  --up-bg: #2c1a1a;
  --down-bg: #172a1d;
  --concl-bg: #1a261c;
  --concl-border: #2f5a3d;
  --weekly: #c4a6f0;
  --weekly-bg: #2a2140;
  --daily: #6dca8f;
  --daily-bg: #1a2b21;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
button, input { font-family: inherit; }
.app {
  display: grid;
  grid-template-rows: var(--header-h) 1fr;
  height: 100%;
}
header.app-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px 0 12px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--line);
  z-index: 20;
}
.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
  color: inherit;
}
.logo-mark {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  display: grid; place-items: center;
  font-weight: 700;
  font-size: 14px;
}
html[data-theme="dark"] .logo-mark { color: #102116; }
.logo-text { display: flex; flex-direction: column; line-height: 1.15; }
.logo-text strong { font-size: 14.5px; font-weight: 700; }
.logo-text span { font-size: 11px; color: var(--text-dim); }
.header-search {
  flex: 1 1 auto;
  min-width: 0;
  max-width: 420px;
  position: relative;
}
.header-search input {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--text);
  border-radius: 999px;
  padding: 7px 32px 7px 36px;
  font-size: 14px;
  outline: none;
}
.header-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.header-search .icon-search, .header-search .icon-clear {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; color: var(--text-dim);
  pointer-events: none;
}
.header-search .icon-search { left: 12px; }
.header-search .icon-clear {
  right: 10px; pointer-events: auto; cursor: pointer; border: 0; background: none; padding: 0;
  display: none;
}
.header-search.has-query .icon-clear { display: grid; place-items: center; }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.icon-btn, .seg button {
  border: 1px solid var(--line);
  background: var(--bg-elev);
  color: var(--text);
  border-radius: 8px;
  height: 34px;
  padding: 0 10px;
  cursor: pointer;
  font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px;
}
.icon-btn:hover, .seg button:hover { background: var(--accent-soft); }
.icon-btn { width: 34px; justify-content: center; padding: 0; }
.icon-btn svg, .seg svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.seg { display: flex; padding: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; }
.seg button { border: 0; background: transparent; height: 28px; border-radius: 7px; }
.seg button[aria-pressed="true"] { background: var(--bg-elev); box-shadow: var(--shadow); font-weight: 600; }
.burger { display: none; }
.meta-count { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
.body {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 0;
}
.sidebar {
  background: var(--bg-sidebar);
  border-right: 1px solid var(--line);
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
}
.sidebar-list { list-style: none; margin: 0; padding: 8px; }
.sidebar-item {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  color: inherit;
  border-radius: 10px;
  padding: 10px 10px 10px 12px;
  cursor: pointer;
  border-left: 3px solid transparent;
}
.sidebar-item:hover { background: var(--bg-elev); }
.sidebar-item[aria-current="true"] {
  background: var(--bg-elev);
  border-left-color: var(--accent);
  box-shadow: var(--shadow);
}
.item-row { display: flex; align-items: baseline; gap: 8px; }
.item-date { font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.item-dow { font-size: 12px; color: var(--text-dim); }
.badge {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .04em;
  border-radius: 999px;
  padding: 1px 7px;
  margin-left: auto;
}
.badge.daily { color: var(--daily); background: var(--daily-bg); }
.badge.weekly { color: var(--weekly); background: var(--weekly-bg); }
.item-concl {
  margin: 4px 0 0;
  font-size: 12.5px;
  color: var(--text-dim);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.main {
  min-width: 0;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
}
.main-inner {
  max-width: calc(var(--measure) + 64px);
  margin: 0 auto;
  padding: 24px 32px 80px;
}
.report-head { margin-bottom: 16px; }
.report-kicker { font-size: 12px; color: var(--text-dim); letter-spacing: .06em; }
.report-head h1 {
  font-size: 1.45rem;
  line-height: 1.4;
  margin: 4px 0 0;
  font-weight: 800;
  letter-spacing: .01em;
}
.conclusion {
  background: var(--concl-bg);
  border: 1px solid var(--concl-border);
  border-radius: var(--radius);
  padding: 14px 18px 12px;
  margin: 0 0 28px;
  position: sticky;
  top: 0;
  z-index: 5;
  box-shadow: var(--shadow);
}
.conclusion .label {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .12em;
  color: var(--accent);
  margin: 0 0 6px;
}
.conclusion .body-md { font-size: 15px; line-height: 1.75; }
.conclusion .body-md p { margin: 0 0 .4em; }
.conclusion .body-md p:last-child,
.conclusion .body-md ul:last-child,
.conclusion .body-md ol:last-child { margin-bottom: 0; }
.article {
  font-size: 16.5px;
  line-height: 1.9;
  font-variant-numeric: tabular-nums;
}
.article h1, .article h2, .article h3 {
  line-height: 1.45;
  margin: 1.6em 0 .5em;
  letter-spacing: .01em;
}
.article h1 { font-size: 1.35rem; }
.article h2 { font-size: 1.18rem; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.article h3 { font-size: 1.05rem; }
.article p { margin: 0 0 1em; }
.article ul, .article ol { margin: 0 0 1em; padding-left: 1.4em; }
.article li { margin: .25em 0; }
.article li::marker { color: var(--text-dim); }
.article hr { border: 0; border-top: 1px solid var(--line); margin: 1.5em 0; }
.article strong { font-weight: 700; }
.num-up { color: var(--up); font-weight: 700; }
.num-down { color: var(--down); font-weight: 700; }
.fx { color: var(--fx); font-weight: 700; background: var(--fx-bg); border-radius: 3px; padding: 0 3px; }
.empty, .empty-search {
  padding: 48px 24px;
  text-align: center;
  color: var(--text-dim);
}
.timeline { list-style: none; margin: 0; padding: 8px 16px 48px 28px; }
.timeline li { position: relative; padding: 0 0 20px 20px; border-left: 2px solid var(--line); }
.timeline li:last-child { border-left-color: transparent; }
.timeline li::before {
  content: "";
  position: absolute;
  left: -6px; top: 8px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px var(--bg);
}
.timeline li.weekly::before { background: var(--weekly); }
.tl-btn {
  display: block; width: 100%; text-align: left;
  border: 0; background: transparent; color: inherit; cursor: pointer;
  padding: 0 0 0 4px; border-radius: 8px;
}
.tl-btn:hover .tl-concl { color: var(--text); }
.tl-meta { display: flex; align-items: baseline; gap: 8px; }
.tl-date { font-weight: 700; font-variant-numeric: tabular-nums; }
.tl-concl { margin: 4px 0 0; color: var(--text-dim); font-size: 14px; line-height: 1.65; }
.legend { font-size: 11.5px; color: var(--text-dim); margin: 8px 0 0; }
.legend .num-up, .legend .num-down, .legend .fx { font-size: inherit; }
.kbd-hint { font-size: 11.5px; color: var(--text-dim); padding: 8px 16px 16px; }
kbd {
  font-family: var(--mono);
  font-size: 10.5px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 0 4px;
  background: var(--bg-elev);
}
.backdrop { display: none; }

.tl-title { font-size: 1.2rem; margin: 0 0 12px; }

/* ---- header extras ---- */
.hdr-date { display: none; }
.menu-btn { display: none; }
.menu-pop {
  position: fixed; top: calc(var(--header-h) + 4px); right: 8px; z-index: 60;
  min-width: 232px; padding: 6px;
  background: var(--bg-elev); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 8px 28px rgba(0,0,0,.22);
}
.menu-pop[hidden] { display: none; }
.menu-pop button {
  display: flex; align-items: center; gap: 12px; width: 100%;
  min-height: 48px; padding: 0 14px; border: 0; border-radius: 10px;
  background: transparent; color: var(--text); font-size: 15px; text-align: left; cursor: pointer;
  white-space: nowrap;
}
.menu-pop button:hover, .menu-pop button:active { background: var(--accent-soft); }
.menu-pop svg { width: 20px; height: 20px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sheet-head, .sheet-search, .bottom-bar { display: none; }
.menu-pop svg circle { fill: currentColor; }

/* ---- report top: headline, number cards, short conclusion ---- */
.report-head { margin-bottom: 12px; }
.report-head h1 { font-size: 1.15rem; }
.hero {
  background: var(--concl-bg);
  border: 1px solid var(--concl-border);
  border-radius: var(--radius);
  padding: 14px 16px 15px;
  margin: 0 0 12px;
}
.label {
  font-size: 11px; font-weight: 800; letter-spacing: .12em;
  color: var(--accent); margin: 0 0 6px;
}
.headline { margin: 0; font-size: 1.2rem; line-height: 1.6; font-weight: 800; letter-spacing: .01em; }
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
  gap: 8px;
  margin: 0 0 14px;
}
.card {
  min-width: 0;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-top: 3px solid var(--line);
  border-radius: 12px;
  padding: 7px 10px 8px;
}
.card.up { border-top-color: var(--up); background: var(--up-bg); }
.card.dn { border-top-color: var(--down); background: var(--down-bg); }
.card.fx { border-top-color: var(--fx); background: var(--fx-bg); }
.c-label {
  display: flex; align-items: baseline; gap: 5px; white-space: nowrap; overflow: hidden;
  font-size: 11.5px; color: var(--text-dim); line-height: 1.5;
}
.c-label b { font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.c-label i { font-style: normal; font-size: 10.5px; color: var(--text-dim); flex: 0 0 auto; }
.c-val { font-size: 1.1rem; font-weight: 800; line-height: 1.35; white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.card.up .c-val { color: var(--up); }
.card.dn .c-val { color: var(--down); }
.card.fx .c-val { color: var(--fx); }
.c-sub { font-size: 11.5px; line-height: 1.45; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.45em; font-variant-numeric: tabular-nums; }
.c-sub.up { color: var(--up); }
.c-sub.dn { color: var(--down); }
.cards-more { margin: -6px 0 14px; }
.cards-more > summary, details.more > summary {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; border-radius: 10px; cursor: pointer; list-style: none;
  color: var(--accent); font-weight: 700; font-size: 14.5px; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.cards-more > summary::-webkit-details-marker, details.more > summary::-webkit-details-marker { display: none; }
.cards-more > summary:active, details.more > summary:active { background: var(--accent-soft); }
.cards-more[open] > summary .t-closed, details.more[open] > summary .t-closed { display: none; }
.cards-more:not([open]) > summary .t-open, details.more:not([open]) > summary .t-open { display: none; }
.cards-more .cards { margin: 4px 0 0; }
.concl { margin: 0 0 16px; padding: 2px 0 2px 14px; border-left: 3px solid var(--concl-border); }
.concl .body-md { font-size: 15.5px; line-height: 1.85; }
.concl .body-md p { margin: 0 0 .5em; }
.concl .body-md p:last-child { margin-bottom: 0; }
details.more > summary { justify-content: flex-start; margin-left: -8px; padding: 0 8px; }
details.more > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-2px) rotate(45deg); }
details.more[open] > summary::after { transform: translateY(2px) rotate(-135deg); }
.more-body { padding-top: 4px; }
.more-body ul, .more-body ol { padding-left: 1.2em; }
.legend { font-size: 11.5px; color: var(--text-dim); margin: 0 0 14px; line-height: 1.7; }
.legend span { white-space: nowrap; }
.headline, .report-head h1, .tl-concl, .item-concl { text-wrap: pretty; }
.headline { text-wrap: balance; }
.headline.long { font-size: 1.06rem; line-height: 1.65; }
.header-search input::-webkit-search-cancel-button, .header-search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }

/* ---- article: collapsible sections, scannable bullets ---- */
.sec-tools { display: flex; justify-content: flex-end; margin: 0 0 6px; }
.sec-tools button {
  min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--bg-elev); color: var(--text-dim); font-size: 13px; cursor: pointer; white-space: nowrap;
}
.article { font-size: 16px; line-height: 1.85; }
.article h3 { margin: 1.2em 0 .4em; }
.sec { border: 1px solid var(--line); border-radius: 14px; background: var(--bg-elev); margin: 0 0 10px; overflow: hidden; }
.sec > summary {
  list-style: none; cursor: pointer; min-height: 56px; padding: 9px 14px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; align-items: center;
  -webkit-tap-highlight-color: transparent;
}
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary:active { background: var(--accent-soft); }
.sec-title { grid-column: 1; font-weight: 800; font-size: 1.04rem; line-height: 1.45; }
.sec-prev { grid-column: 1; font-size: 12.5px; line-height: 1.5; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec-prev:empty { display: none; }
.sec[open] .sec-prev { display: none; }
.chev { grid-column: 2; grid-row: 1 / span 2; width: 9px; height: 9px; border-right: 2px solid var(--text-dim); border-bottom: 2px solid var(--text-dim); transform: rotate(45deg); transition: transform .15s ease; margin-right: 4px; }
.sec[open] > summary .chev { transform: translateY(2px) rotate(-135deg); }
.sec[open] > summary { border-bottom: 1px solid var(--line); }
.sec-body { padding: 8px 14px 6px; }
.sec-body > :first-child { margin-top: .3em; }
.article ul, .article ol { padding-left: 1.15em; }
.article li { margin: 0; padding: .55em 0; }
.article li + li { border-top: 1px dashed var(--line); }
.article li::marker { color: var(--accent); }
.article li.lg .s { display: block; margin-top: .25em; }
.article li.lg .lead { display: block; font-weight: 800; }
.article li.lg .lead + .s { margin-top: 0; }
.article p { margin: 0 0 .9em; }

/* ---- mobile: bottom navigation bar, bottom sheet, calm header ---- */
@media (max-width: 800px) {
  :root { --header-h: 52px; --bar-h: 64px; }
  .app { height: 100%; height: 100dvh; }
  header.app-header { padding: 0 8px 0 14px; gap: 8px; }
  .logo-text span, .meta-count { display: none; }
  .logo-text strong { font-size: 16px; }
  .header-actions { display: none; }
  .menu-btn { display: inline-flex; margin-left: auto; width: 44px; height: 44px; border-radius: 12px; }
  .menu-btn svg { width: 22px; height: 22px; }
  .hdr-date { display: block; margin-left: 4px; font-size: 13px; color: var(--text-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .body { grid-template-columns: 1fr; }
  .main-inner { padding: 14px 16px calc(var(--bar-h) + env(safe-area-inset-bottom) + 28px); }
  .report-head h1 { font-size: 1.05rem; line-height: 1.5; }
  .headline { font-size: 1.22rem; }
  .headline.long { font-size: 1.06rem; }
  .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .article { font-size: 16px; }
  .sec-body { padding: 6px 12px 4px; }

  .sidebar {
    position: fixed; left: 0; right: 0; top: auto;
    bottom: calc(var(--bar-h) + env(safe-area-inset-bottom));
    width: auto; max-height: min(74dvh, 640px);
    z-index: 40;
    display: flex; flex-direction: column;
    border-right: 0; border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    transform: translateY(calc(100% + 90px));
    transition: transform .22s ease;
    box-shadow: 0 -10px 30px rgba(0,0,0,.18);
    overflow: hidden;
    padding-bottom: 4px;
  }

const REPORTS = [{"date":"2026-11-21","title":"夜の戦略レポート 11/21(土)週まとめ","type":"週まとめ","conclusion":"見通しは「弱気寄りの警戒」を続けます。11/20の米国ではAI株が投げ売りされ、Nasdaqは-5.28%、半導体指数(SOX)は-10.7%、NVIDIAは約-14%でした。","conclusion_full":"見通しは「弱気寄りの警戒」を続けます。11/20の米国ではAI株が投げ売りされ、Nasdaqは-5.28%、半導体指数(SOX)は-10.7%、NVIDIAは約-14%でした。大阪取引所の夜間先物は54,550円で、金曜の日経平均終値より1,886円安い水準です。日経平均は週間で4,705.70円安(-7.70%)の56,436.65円で、下げの約3分の1(約1,534円)はアドバンテスト1銘柄によるものです。新しい悪材料は2つあります。1つ目は、ロイターが「SECがNVIDIAの会計処理を調査中」と報じたことです(関係筋の話で、不正が確認されたわけではありません)。2つ目は、トランプ大統領が「国外にデータセンターを建てる米企業に巨額の税を課す」と発言したことです(税率や時期は未定です)。","markdown":"**夜の戦略レポート 11/21(土)週まとめ**\n\n**結論:** 見通しは「弱気寄りの警戒」を続けます。11/20の米国ではAI株が投げ売りされ、Nasdaqは-5.28%、半導体指数(SOX)は-10.7%、NVIDIAは約-14%でした。大阪取引所の夜間先物は54,550円で、金曜の日経平均終値より1,886円安い水準です。日経平均は週間で4,705.70円安(-7.70%)の56,436.65円で、下げの約3分の1(約1,534円)はアドバンテスト1銘柄によるものです。新しい悪材料は2つあります。1つ目は、ロイターが「SECがNVIDIAの会計処理を調査中」と報じたことです(関係筋の話で、不正が確認されたわけではありません)。2つ目は、トランプ大統領が「国外にデータセンターを建てる米企業に巨額の税を課す」と発言したことです(税率や時期は未定です)。\n\n**A. 企業決算**\n\n過去7日間の確定した動きです。\n- **NVIDIA(公式、11/17発表のFY27 Q3):** 売上は1,158億ドル(+103%)、うちデータセンターが1,076億ドル、粗利率は74.9%、EPSは2.68ドル(予想2.47ドル)でした。Q4の売上ガイダンスは1,300億ドル±3%で、市場予想の約1,250億ドルを上回っています(中国向けデータセンター売上はゼロ前提)。一方、Q4の粗利率見通しは71〜72%に下がります。株価は発表後の時間外で+4〜5%となりましたが続かず、11/19は145.98ドル、11/20は125.53ドル(約-14%)まで下げました。業績は良いのに株価は下がる、というずれがはっきりしています。\n- **Anthropic IPO:** 公開価格は83ドル、初値は111.50ドル、初日の終値は97.17ドルでした。翌11/20は-9.1%です。上場を通過したことで、利益確定売りが出やすくなっています。\n- **JT:** ロシア子会社を連結から外し、約1.38兆円の損失を計上します。通期は7,240億円の赤字予想で、配当も272円から204円に減らします。株価は11/20に-10.1%でした。\n- **東京海上・SOMPO:** 大規模な自社株買いを発表し、全面安の中で上昇しました。日経平均を押し上げた銘柄の上位に入っています。買い入れ規模は、このレポートでは確認できていません。\n\n今後30日の注目決算です(日本時間)。\n- **Dell:** 11/25 6:30(説明会あり)\n- **Marvell:** 12/1(米国)\n- **Salesforce:** 12/2、米国の引け後\n- **Broadcom:** 12/10 7:00\n- **Micron:** 12/18 6:30(説明会あり)\n- **Oracle:** 公式の日付はまだ発表されていません(12/14との観測はあります)。\n\n**B. セクター動向**\n- **値動き:** 東証33業種はすべて週間で下落しました。相対的に底堅かったのは空運(-0.33%)、小売(-0.44%)、医薬品(-0.50%)です。大きく下げたのは非鉄金属(-21.56%)、ガラス・土石(-11.19%)、銀行(-10.98%)です。米国の11/20は情報技術が-7.11%で、上がったのは生活必需品(+0.68%)だけでした。\n- **実際の資金の流れ:** 海外投資家は11/9〜13に現物株を3,124億円売り越し(3週連続)、信託銀行は3,933億円の買い越しでした。LSEG Lipperによると、テック系投信には11/18までの週に123億ドルの資金が流入していました。つまり金曜の急落前までは、価格が下がる一方で資金は入っていたことになります。急落後に資金が流出したかは、まだ確認できていません。\n- **注目業界:** 1つ目は損害保険です。株主還元が強く、金利上昇も追い風になっており、資金の逃げ場になっています。2つ目はAI半導体です。NVIDIAのガイダンスを見る限り実需は強い一方、規制・会計報道・バリュエーションの見直しが同時に来ています。中長期では押し目になる可能性がある一方、短期の下値はまだ読めません。3つ目は医薬品や小売などのディフェンシブです。市場規模の新しい数値は今回取得していないため、載せていません。\n\n**C. 重点テーマ**\n- **AI・半導体:** 11/16のBIS規制、11/20のトランプ発言、SEC報道と悪材料が重なりました。キャタピラーも-5%で、電力・非常用電源の需要が鈍るとの懸念が電力関連にも広がっています。\n- **金利:** 米10年債は週間で約5.15%から4.95%に低下しました。それでも12月FOMCでの0.25%利上げは、ほぼ確実視されたままです(クック理事も追加利上げが必要と発言しています)。ミシガン大学の1年先の期待インフレ率は3.7%に下方修正されました。\n- **為替:** ドル円は158.57円です。160円手前では介入への警戒が強いです。日銀の12月利上げは、OISで約78%織り込まれています(報道ベース)。\n- **その他の市場:** 金は3,515.4ドル(-170.1ドル)で、追証に対応するための換金売りが出たとみられています。WTIは83.98ドル、ビットコインは約5.8万ドル(週間で2桁の下落)、VIXは35.89で2025年4月以来の高水準です。\n- **防衛・原子力・宇宙・医療・ロボティクス:** 今週は大きな一次材料がありませんでした。\n\n**D. 経済・政策イベント(JST)**\n- 11/23(月): 東京市場は休場(勤労感謝の日)\n- 11/25 6:30: Dell決算\n- 11/25 22:30: 米GDP2次推計、10月PCE\n- 11/26: 米国休場(感謝祭)\n- 11/27 8:30: 東京都区部CPI\n- 11/29: OPECプラス会合(時刻未定)\n- 12/2 0:00: 米ISM製造業\n- 12/4 22:30: 米雇用統計\n- 12/10 4:00: FOMC、7:00にBroadcom決算、22:30に米CPI\n- 12/14 8:50: 日銀短観\n- 12/17 22:15: ECB\n- 12/18: 全国CPI(8:30)、Micron決算(6:30)、日銀会合の結果発表\n\n**日経平均への影響**\n- 11/20の実際の寄与度は、アドバンテスト-601.93円、ソフトバンクグループ-414.23円、東京エレクトロン-319.07円でした。\n- 24日の寄り付きは、夜間先物の54,550円が目安です。4月の安値56,232円を下回って始まる可能性があります。PERは約14倍で割安感はありますが、値がさの半導体株に寄与が集中しているため、下げが大きくなりやすい構造です。\n\n**E. まとめ**\n- **最も強気な業界:** 損害保険です。前週は銀行でしたが、今週は銀行も-11%となったため変更しました。\n- **最大のリスク:** AI株の評価見直しとNVIDIAの会計報道の連鎖に、米国の利上げが重なることです。\n- **注目企業5社:** NVIDIA、アドバンテスト、ソフトバンクグループ、Dell、Micron\n- **重要テーマ3つ:** AIの収益化と規制、FOMCの利上げと日銀の12月会合、円相場と介入\n- **強気に転じる条件:** SEC報道が否定されるか影響が限定的と分かること、Dell・Broadcom・Micronが受注やガイダンスでAI需要を裏付けること、PCEが落ち着いて米金利が下がることです。\n- **弱気に転じる条件:** SEC調査が具体化する、データセンター課税が具体化する、日経平均が4月安値を明確に割り込む、のいずれかです。\n\n**副業へのヒント(推測)**\n相場が荒れる局面では、「決算・指標カレンダー」や「下落局面のリスク管理」といった解説コンテンツの需要が高まりやすいです。一度作れば繰り返し読まれるストック型のテンプレート(記事やNotionでの配布など)を作る好機と考えられます。\n\n**カレンダー:** 新規5件(Dell、東京都区部CPI、日銀短観、全国CPI、Micron)を登録しました。更新はありません。Oracleは公式の日付が未発表のため見送り、SalesforceとMarvellは重要度の判断で登録を見送りました。\n","summary":{"headline":"見通しは「弱気寄りの警戒」を続けます。","lead":"11/20の米国ではAI株が投げ売りされ、Nasdaqは-5.28%、半導体指数(SOX)は-10.7%、NVIDIAは約-14%でした。大阪取引所の夜間先物は54,550円で、金曜の日経平均終値より1,886円安い水準です。","rest":"日経平均は週間で4,705.70円安(-7.70%)の56,436.65円で、下げの約3分の1(約1,534円)はアドバンテスト1銘柄によるものです。新しい悪材料は2つあります。1つ目は、ロイターが「SECがNVIDIAの会計処理を調査中」と報じたことです(関係筋の話で、不正が確認されたわけではありません)。2つ目は、トランプ大統領が「国外にデータセンターを建てる米企業に巨額の税を課す」と発言したことです(税率や時期は未定です)。","stats":[{"label":"日経平均","value":"-7.70%","dir":"dn","sub":"56,436.65円","tag":"週間"},{"label":"Nasdaq","value":"-5.28%","dir":"dn","sub":"","tag":"11/20"},{"label":"SOX","value":"-10.7%","dir":"dn","sub":"","tag":"11/20"},{"label":"NVIDIA","value":"-14%","dir":"dn","sub":"","tag":"11/20"},{"label":"ドル円","value":"158.57円","dir":"fx","sub":"","tag":""},{"label":"先物","value":"54,550円","dir":"flat","sub":"","tag":""}]}},{"date":"2026-11-20","title":"夜の戦略レポート 11/20(金)、前日からの変化点","type":"日次","conclusion":"Anthropicの上場をきっかけに、AI相場で「材料出尽くし」の売りが日米同時に広がりました。","conclusion_full":"Anthropicの上場をきっかけに、AI相場で「材料出尽くし」の売りが日米同時に広がりました。日経平均は3,007.56円安(-5.06%)の56,436.65円で、1日の下げ幅は過去5番目の大きさです。安値引けで、終値で5万7,000円を割るのは4/13以来です。下げの約3分の1はアドバンテスト・ソフトバンクグループ・東京エレクトロンの3社によるものですが、プライム市場の93%の銘柄が下げており、市場全体のリスクオフでした。そのため見通しを「弱気寄りの警戒」に引き下げます。来週の焦点は、米10月PCE(11/25 22:30)と、12月のFOMC・日銀会合での利上げ観測です。","markdown":"**夜の戦略レポート 11/20(金)、前日からの変化点**\n\n**結論:** Anthropicの上場をきっかけに、AI相場で「材料出尽くし」の売りが日米同時に広がりました。日経平均は3,007.56円安(-5.06%)の56,436.65円で、1日の下げ幅は過去5番目の大きさです。安値引けで、終値で5万7,000円を割るのは4/13以来です。下げの約3分の1はアドバンテスト・ソフトバンクグループ・東京エレクトロンの3社によるものですが、プライム市場の93%の銘柄が下げており、市場全体のリスクオフでした。そのため見通しを「弱気寄りの警戒」に引き下げます。来週の焦点は、米10月PCE(11/25 22:30)と、12月のFOMC・日銀会合での利上げ観測です。\n\n**米国(11/19、確定値)**\n- ダウは49,097.06(-1,101.11、-2.19%)で、6月以来の5万ドル割れです。S\u0026P500は7,175.83(-2.02%、6日続落)、Nasdaqは23,879.20(-2.25%)でした。\n- CNBCによると、ANTの上場直後から指数が下げ、そのまま日中の安値をつけました。\n\n**Anthropic(ANT)**\n- 初値は111.50ドルで、公開価格83ドルより34%高く始まりました。\n- その後は売られ、終値は97.17ドル(公開価格比+17%)です。調達額は約813億ドルで、史上最大のIPOです。\n\n**日本(11/20、確定値)**\n- 日経平均への寄与度は、アドバンテスト-601.93円、ソフトバンクグループ-414.23円、東京エレクトロン-319.07円で、3社合計で約-1,335円でした。ほかにリクルート-99.11円、ファーストリテイリング-93.04円、TDK-79.39円、イビデン-79.29円、キオクシア-68.24円です。\n- TOPIXは3,674.22(-3.88%)、プライム市場の売買代金は8.64兆円です。上げたのは保険と空運の2業種だけでした。\n- JTは、ロシアの子会社7社を連結から外すことで約1.38兆円の損失を計上します。通期の最終損益を7,240億円の赤字に下方修正し、年間配当も272円から204円に減らしました。株価は約10%安です。\n- 10月の全国CPI(総務省)は、生鮮食品を除くコアが+2.2%、生鮮食品とエネルギーを除くコアコアも+2.2%(9月は+2.4%)でした。電気・ガス代が押し上げています。強すぎる数字ではありませんが、日銀の12月利上げ観測は崩れていません。\n\n**金利・為替・その他**\n- 安全資産への逃避で、米10年債の利回りは約5.01〜5.05%に下がりました。ドル円は159.8円台から159.0円前後へ円高に振れています。\n- 韓国KOSPIは-5.21%で、取引が一時停止されました。ビットコインは6.3万ドルを割っています。\n\n**今後の日経への影響(推測)**\n- 寄与度の大きいアドバンテスト・東京エレクトロン・ソフトバンクグループは、米国のAI関連株(NVIDIA・Broadcom・ANT)との連動が一段と強まっています。米ハイテク株が戻らない限り、自律反発があっても長続きしにくいとみています。\n- 159円を割る円高と日銀の利上げ観測は、外需株とグロース株の重しです。保険などの金融株やディフェンシブ株が相対的に強い状況です。\n- 見通しを戻す条件は3つです。米PCEが鈍化して金利が下がりハイテク株が反発すること、ANTが公開価格の83ドルを守ること、12月の日米利上げの織り込みが後退することです。\n\n**カレンダー:** 変更はありません。\n","summary":{"headline":"Anthropicの上場をきっかけに、AI相場で「材料出尽くし」の売りが日米同時に広がりました。","lead":"日経平均は3,007.56円安(-5.06%)の56,436.65円で、1日の下げ幅は過去5番目の大きさです。安値引けで、終値で5万7,000円を割るのは4/13以来です。","rest":"下げの約3分の1はアドバンテスト・ソフトバンクグループ・東京エレクトロンの3社によるものですが、プライム市場の93%の銘柄が下げており、市場全体のリスクオフでした。そのため見通しを「弱気寄りの警戒」に引き下げます。来週の焦点は、米10月PCE(11/25 22:30)と、12月のFOMC・日銀会合での利上げ観測です。","stats":[{"label":"日経平均","value":"-5.06%","dir":"dn","sub":"56,436.65円","tag":""},{"label":"TOPIX","value":"-3.88%","dir":"dn","sub":"3,674.22","tag":""},{"label":"Nasdaq","value":"-2.25%","dir":"dn","sub":"23,879.20","tag":""},{"label":"S\u0026P500","value":"-2.02%","dir":"dn","sub":"7,175.83","tag":""},{"label":"ダウ","value":"-2.19%","dir":"dn","sub":"49,097.06","tag":""}]}},{"date":"2026-11-19","title":"夜の戦略レポート 11/19(木)、前日からの変化点","type":"日次","conclusion":"Anthropicの公開価格は83ドルに決まり、仮条件(70〜78ドル)の上限を超えました。","conclusion_full":"Anthropicの公開価格は83ドルに決まり、仮条件(70〜78ドル)の上限を超えました。AIへの資金需要の強さが確認され、日経平均は続伸しました。ただ上げ幅の約6割はソフトバンクグループと東京エレクトロンの2社によるもので、TOPIXは4日続落です。相場全体には広がっていません。一方、FOMC議事要旨ではほぼ全員が追加利上げを適切と考えていたことがわかり、12月の利上げはほぼ織り込まれました。今夜のANTの初値と、明朝の日本CPIが次の分かれ目です。","markdown":"**夜の戦略レポート 11/19(木)、前日からの変化点**\n\n**結論:** Anthropicの公開価格は83ドルに決まり、仮条件(70〜78ドル)の上限を超えました。AIへの資金需要の強さが確認され、日経平均は続伸しました。ただ上げ幅の約6割はソフトバンクグループと東京エレクトロンの2社によるもので、TOPIXは4日続落です。相場全体には広がっていません。一方、FOMC議事要旨ではほぼ全員が追加利上げを適切と考えていたことがわかり、12月の利上げはほぼ織り込まれました。今夜のANTの初値と、明朝の日本CPIが次の分かれ目です。\n\n**Anthropic(ANT)のIPO(会社公式、11/18)**\n- 公開価格は83.00ドルで、売り出しは9.8億株(うち会社分は約9.56億株)です。\n- 調達額は約813億ドルで史上最大のIPOです(AP・IBDの報道)。完全希薄化ベースの時価総額は約1.5兆ドルです(CNBC)。\n- 取引は日本時間の今夜、Nasdaqで始まります。初値がつく時刻は公表されていません。\n- オンチェーンの事前取引では約106ドル(公開価格の+27%)という数字が出ています。ただしこれは非公式の参考値です。\n\n**FOMC議事要旨(10/27〜28会合、11/18公表)**\n- 政策金利は3.75〜4.00%で据え置かれ、決定は10対2でした。Cook理事とHammack総裁は0.25%の利上げを主張して反対しています。\n- ほぼ全員が「今後数か月以内の追加利上げが適切」と考えていました。インフレが改善しなければ、12月に0.25%を超える利上げも検討すべきだという意見も出ています。Waller理事も12月の大幅利上げに言及しました。\n- 市場は12月の0.25%利上げを約92〜95%織り込んでいます(報道ベース)。発表後、金は3%超下げたと報じられています。\n\n**米国市場(11/18、確定値)**\n- ダウは50,198.17(-561.25)で3日続落、Nasdaqは24,429.89(+101.51)でした。\n- NVIDIAは好決算にもかかわらず5営業日続落です。後任CEOの人事と当局の調査への懸念が重しになっています。\n- ヘルスケア株は、CMSの不正防止規制案と国民皆保険案を嫌気してUnitedHealthなどが下げました。TargetとTJXは通期見通しの引き上げで上昇し、Palo Altoは時間外で上げています。\n- WTIは81.86ドル(-3.30%)でした。トランプ大統領が「イランとの協議は極めて順調」と発言したのが背景です。ドル円はNY終値で159.35円でした。\n\n**日本市場(11/19、確定値)**\n- 日経平均は59,444.21円(+419.93円、+0.71%)、高値は59,660.61円でした。TOPIXは3,822.47(-0.04%)、プライム市場の売買代金は7.72兆円です。日経平均の構成銘柄は値上がり95、値下がり127でした。\n- 押し上げ側の寄与度は、ソフトバンクグループ+124.59円、東京エレクトロン+121.86円、コナミ+38.43円、ダイキン+30.34円です。押し下げ側はアドバンテスト(約-32円)、豊田通商、三菱商事が続きます。\n- アドバンテストは夜間のPTSで27,450円(東証終値比+1.5%、20:13時点)です。\n- 夕方の時点でドル円は159.78円、米10年債は5.07%前後です。\n\n**見通し(推測)**\nANTの初値が83ドルを大きく上回れば、ソフトバンクグループ・東京エレクトロン・キオクシアなどAI関連の値がさ株に追い風です。逆に公開価格を割れば、今日の上げは逆回転しやすいとみています。また、FOMCのタカ派化と160円目前の円安は、金利上昇を通じて上値を抑える要因です。\n- **強気に転じる条件:** ANTの初値と終値が堅調で、NVIDIAの後任CEOも決まることです。\n- **弱気に転じる条件:** ANTが公開価格を割るか、明朝の日本CPIや11/25の米PCEが上振れして日米の利上げ観測がさらに強まることです。\n\n**今後の注目(JST)**\n- 11/19夜: ANTの取引開始\n- 11/20 8:30: 日本10月全国CPI\n- 11/25 22:30: 米PCE\n- 12/4: 米雇用統計\n- 12/10: FOMC\n- 12/18: 日銀会合\n\n**カレンダー:** 更新1件で、Anthropic IPOの説明欄に公開価格などを追記しました。新規登録はありません。\n","summary":{"headline":"Anthropicの公開価格は83ドルに決まり、仮条件(70〜78ドル)の上限を超えました。","lead":"AIへの資金需要の強さが確認され、日経平均は続伸しました。ただ上げ幅の約6割はソフトバンクグループと東京エレクトロンの2社によるもので、TOPIXは4日続落です。","rest":"相場全体には広がっていません。一方、FOMC議事要旨ではほぼ全員が追加利上げを適切と考えていたことがわかり、12月の利上げはほぼ織り込まれました。今夜のANTの初値と、明朝の日本CPIが次の分かれ目です。","stats":[{"label":"日経平均","value":"+0.71%","dir":"up","sub":"59,444.21円","tag":""},{"label":"TOPIX","value":"-0.04%","dir":"dn","sub":"3,822.47","tag":""},{"label":"Nasdaq","value":"24,429.89","dir":"up","sub":"+101.51","tag":""},{"label":"ダウ","value":"50,198.17","dir":"dn","sub":"-561.25","tag":""},{"label":"ドル円","value":"159.35円","dir":"fx","sub":"","tag":""}]}},{"date":"2026-11-18","title":"夜の戦略レポート 11/18(水)、前日からの変化点","type":"日次","conclusion":"NVIDIA決算は、数字の上ではすべての予想をはっきり上回り、CEO交代とBIS規制で強まっていたAI半導体への悲観はいったん後退しました。","conclusion_full":"NVIDIA決算は、数字の上ではすべての予想をはっきり上回り、CEO交代とBIS規制で強まっていたAI半導体への悲観はいったん後退しました。ただ、日本株への効果は値がさの半導体株に偏っています。日経平均は3日ぶりに反発しましたが、TOPIXは3日続落で、相場全体の回復には広がっていません。今夜から明日は、Anthropicの公開価格の決定と上場、FOMC議事要旨が焦点です。","markdown":"**夜の戦略レポート 11/18(水)、前日からの変化点**\n\n**結論:** NVIDIA決算は、数字の上ではすべての予想をはっきり上回り、CEO交代とBIS規制で強まっていたAI半導体への悲観はいったん後退しました。ただ、日本株への効果は値がさの半導体株に偏っています。日経平均は3日ぶりに反発しましたが、TOPIXは3日続落で、相場全体の回復には広がっていません。今夜から明日は、Anthropicの公開価格の決定と上場、FOMC議事要旨が焦点です。\n\n**NVIDIA決算(会社公式、11/17発表のFY27 Q3)**\n- 売上は1,158億ドル(前年比+103%、前期比+20%)で、うちデータセンターが1,076億ドル(+110%)でした。粗利率は74.9%、EPSは2.68ドル(いずれもNon-GAAP)です。\n- 市場予想(売上約1,088億ドル、EPS 2.47ドル)と、会社予想の粗利率74.0%をすべて上回りました。\n- Q4の売上ガイダンスは1,300億ドル±3%で、市場予想の約1,250億ドルを上回ります。中国向けのデータセンター売上はゼロの前提で、Q4は通常より1週間長い四半期です。一方で、粗利率は71〜72%に下がる見通しで、ここは注意点です。\n- 次世代機Vera Rubin NVL72の出荷を始め、Anthropicへの計算資源の供給拡大も明記されました。\n- 株価は時間外で約+4〜5%(終値155.46ドルから約162.5ドル、報道ベース)でした。クレス暫定CEOがFY28の成長見通しを引き上げたとの報道もありますが、一次資料では確認できていません。アナリストの関心は、後任CEOとQ4の粗利率低下に移っています。\n\n**日本市場(確定値)**\n- 日経平均は59,024.28円(+163.85円、+0.28%)で、高値は9:09の59,630.95円、安値は11:18の58,279.26円でした。TOPIXは3,824.00(-0.42%)、プライム市場の売買代金は8.05兆円です。プライム市場の約7割の銘柄が下げており、指数の上昇は一部の銘柄頼みでした。\n- 押し上げ側は、アドバンテストが約+255円、2位のソフトバンクグループと合わせて約338円です。次いでTDK、東京エレクトロン、レーザーテック、村田製作所が続きます。\n- 押し下げ側は、ファーストリテイリングが約-110円で、リクルート、中外製薬、大塚HD、日東電工が続きます。\n- 業種別では石油・電気機器・海運が上げ、サービス・空運・陸運が下げました。\n- 楽天証券の不正アクセス・情報漏えいの報道を受け、楽天銀行が-15%、楽天グループが-5.7%でした。漏えいした口座数は、報道によって約1,125万〜1,572万と差があります。銅安で住友金属鉱山も-4.6%です。\n- NVIDIAの上振れは、短期的にアドバンテスト・東京エレクトロン・レーザーテックを支える材料です。ただ、BISの海外データセンター規制の先行きが見えないため、上値は抑えられやすいとみています(推測)。\n\n**米国・金利・為替(11/17)**\n- ダウは50,759.42(-848.75)、Nasdaqは24,328.38(-181.38)で続落しました。背景は、FAA・大手銀行・NSAで相次いだシステム障害によるサイバー攻撃への憶測、イラン情勢の緊張、FRBのタカ派発言、NVIDIA決算前の手仕舞い売りです。\n- 米10月小売売上高は前月比+0.2%(予想並み)、自動車を除くと+0.6%でした。鉱工業生産は-0.4%、NAHB住宅市場指数は25(前回29)です。\n- 米10年債は5.11%(-0.02)、WTIは86.01ドル、金は3,864.2ドル、ドル円は159.38円(NY終値)でした。\n\n**今後の注目(JST、すべてカレンダー登録済み)**\n- **11/19:** Anthropic(ANT)がNasdaqに上場します。CNBCは仮条件の70〜78ドルを上回る価格になる可能性を報じていますが、会社の正式な価格はまだ出ていません。\n- **11/19 4:00:** FOMC議事要旨\n- **11/20 8:30:** 日本10月全国CPI\n- **このあと:** 11/25 22:30に米PCE、12/4に米雇用統計、12/10にFOMC、12/18に日銀会合\n\n**見通しが変わる条件**\n- **強気側:** Anthropicの初値が好調で、NVIDIAの後任CEOも早く決まり、半導体以外のAI関連にも買いが広がる場合です。\n- **弱気側:** サイバー攻撃が確認される、イラン情勢で原油が90ドルを超える、FOMC議事要旨で追加利上げ観測が強まり米10年債が5.2%台に乗る、のいずれかです。\n\n**カレンダー:** 変更はありません。Anthropicは公開価格が決まった時点で、説明欄を更新します。\n","summary":{"headline":"NVIDIA決算は、数字の上ではすべての予想をはっきり上回り、CEO交代とBIS規制で強まっていたAI半導体への悲観はいったん後退しました。","lead":"ただ、日本株への効果は値がさの半導体株に偏っています。日経平均は3日ぶりに反発しましたが、TOPIXは3日続落で、相場全体の回復には広がっていません。","rest":"今夜から明日は、Anthropicの公開価格の決定と上場、FOMC議事要旨が焦点です。","stats":[{"label":"日経平均","value":"+0.28%","dir":"up","sub":"59,024.28円","tag":""},{"label":"TOPIX","value":"-0.42%","dir":"dn","sub":"3,824.00","tag":""},{"label":"Nasdaq","value":"24,328.38","dir":"dn","sub":"-181.38","tag":""},{"label":"ダウ","value":"50,759.42","dir":"dn","sub":"-848.75","tag":""},{"label":"ドル円","value":"159.38円","dir":"fx","sub":"","tag":""}]}},{"date":"2026-11-17","title":"夜の戦略レポート 11/17(火)、前回からの変化点","type":"日次","conclusion":"米国のAI半導体の輸出規制強化と、明朝のNVIDIA決算を前にした売りが重なり、日経平均は2日間で約2,280円下げました。","conclusion_full":"米国のAI半導体の輸出規制強化と、明朝のNVIDIA決算を前にした売りが重なり、日経平均は2日間で約2,280円下げました。押し下げの大半は値がさの半導体株です。市場全体が売られたというより、AI関連の持ち高を減らす動きが中心でした。金利と為替は大きく動いていないので、マクロ要因ではなくAIセクター特有の調整とみています。","markdown":"**夜の戦略レポート 11/17(火)、前回からの変化点**\n\n**結論:** 米国のAI半導体の輸出規制強化と、明朝のNVIDIA決算を前にした売りが重なり、日経平均は2日間で約2,280円下げました。押し下げの大半は値がさの半導体株です。市場全体が売られたというより、AI関連の持ち高を減らす動きが中心でした。金利と為替は大きく動いていないので、マクロ要因ではなくAIセクター特有の調整とみています。\n\n**米国のAI半導体規制(米商務省BIS、11/16公表の暫定規則)**\n- 中国など規制対象国の企業に、海外のデータセンター経由で大きな計算能力を提供する場合、ライセンスと顧客確認が必要になりました。\n- インドネシア、マレーシア、シンガポール、タイ、ブラジル向けの先端AI半導体の輸出にもライセンスが必要です。\n- 既存のデータセンターは90日以内にライセンスを取る必要があります。\n\n**米国市場(11/16)**\n- ダウは51,608.17(-739.38)、S\u0026P500は7,416.59(-1.9%、3日続落)、Nasdaqは24,509.76(-626.51)で、VIXは22.91(+3.61)に上がりました。\n- 銀行株は、JPモルガンなどの送金遅延の報道で下げました。JPモルガンは「ソフトの不具合で、サイバー攻撃ではない」と説明しています。\n- 米10年債は5.132%、WTIは85.72ドル、金は3,853.0ドル、シカゴの日経先物(円建て)は59,205円です。\n- ウォーシュFRB議長は講演で「AIは将来の金融政策に重要な意味を持つ」と述べましたが、次の利上げについての示唆はありませんでした。\n\n**東京市場(11/17、確定値)**\n- 日経平均は58,860.43円(-801.59円、-1.34%)で、終値で5.9万円を割るのは9日以来です。安値は9:08の58,691.11円でした。\n- TOPIXは3,840.02(-1.57%)、グロース250は688.39(-3.49%)、プライム市場の売買代金は7.92兆円でした。日経平均の構成銘柄は、値上がり35、値下がり188です。\n- 大引けの寄与度(Fisco)は、マイナス側がアドバンテスト-257.82円、ソフトバンクグループ-109.22円、東京エレクトロン-69.28円、イビデン-48.54円、キオクシア-30.16円です。プラス側はリクルート+87.98円、ファーストリテイリング+53.40円でした。半導体・データセンター関連から、サービス・小売へ資金が移っています。\n- ドル円は19時時点で158.98円前後です。\n\n**これからの予定(JST)**\n- **今夜22:30:** 米10月小売売上高。予想は前月比+0.1%、自動車を除くと+0.4%です。\n- **明朝6:20:** NVIDIA決算(説明会は7:00)。予想は売上が約1,088億ドル、次の四半期の売上ガイダンスが約1,250億ドル、粗利率が74%前後です(Motley Fool、Investing.com)。規制強化の影響をガイダンスにどう織り込むかが焦点です。\n- **Anthropic(ANT):** 値決めは米国時間11/18の夕方、Nasdaqでの取引開始は11/19の予定です(CNBC)。仮条件は70〜78ドルのままです。\n\n**見通し(推測)**\n明朝のNVIDIA決算で、規制強化を織り込んだ次の四半期の見通しと、CEO交代後の経営陣の説明がどう出るかが分かれ目です。その内容しだいで、アドバンテスト・東京エレクトロン・ソフトバンクグループの戻り方が決まるとみています。\n\n**カレンダー:** 変更はありません。MicronとOracleは公式の決算日がまだ出ていないため、登録を見送りました。\n","summary":{"headline":"米国のAI半導体の輸出規制強化と、明朝のNVIDIA決算を前にした売りが重なり、日経平均は2日間で約2,280円下げました。","lead":"押し下げの大半は値がさの半導体株です。市場全体が売られたというより、AI関連の持ち高を減らす動きが中心でした。","rest":"金利と為替は大きく動いていないので、マクロ要因ではなくAIセクター特有の調整とみています。","stats":[{"label":"日経平均","value":"-1.34%","dir":"dn","sub":"58,860.43円","tag":""},{"label":"TOPIX","value":"-1.57%","dir":"dn","sub":"3,840.02","tag":""},{"label":"Nasdaq","value":"24,509.76","dir":"dn","sub":"-626.51","tag":""},{"label":"S\u0026P500","value":"-1.9%","dir":"dn","sub":"7,416.59","tag":""},{"label":"ダウ","value":"51,608.17","dir":"dn","sub":"-739.38","tag":""},{"label":"ドル円","value":"158.98円","dir":"fx","sub":"","tag":""}]}},{"date":"2026-11-16","title":"夜の戦略レポート 11/16(月)、前回からの変化点","type":"日次","conclusion":"日経平均は1,480円安(-2.42%)の59,662円で、1週間ぶりに6万円を割りました。","conclusion_full":"日経平均は1,480円安(-2.42%)の59,662円で、1週間ぶりに6万円を割りました。AI・半導体株の売りが中心で、NVIDIA決算(11/18早朝 JST)を前に買いにくい状態です。200日移動平均線(ロイターによると62,000円台前半)も取り戻せていないため、短期の見方を一段慎重にし、「NVIDIA決算までは弱含み、結果次第で大きく振れる」とします。","markdown":"**夜の戦略レポート 11/16(月)、前回からの変化点**\n\n**結論:** 日経平均は1,480円安(-2.42%)の59,662円で、1週間ぶりに6万円を割りました。AI・半導体株の売りが中心で、NVIDIA決算(11/18早朝 JST)を前に買いにくい状態です。200日移動平均線(ロイターによると62,000円台前半)も取り戻せていないため、短期の見方を一段慎重にし、「NVIDIA決算までは弱含み、結果次第で大きく振れる」とします。\n\n**日本市場(確定値)**\n- 日経225は59,662.02円(-1,480.33円)でした。始値は61,348円、安値は14:51の59,630.51円で、ほぼ安値圏で引けています。\n- TOPIXは3,901.37(-1.02%)、グロース250は713.30(-2.04%、3日続落)です。プライム市場の売買代金は7.93兆円、値上がり655銘柄、値下がり857銘柄でした。\n- 主に押し下げたのはアドバンテストや東京エレクトロンです。ただ、寄与度の正確な数値は取れていません。\n- 業種別では非鉄金属・電気機器・ガラスが下げ、小売・水産などが上げました。個別では、クレディセゾンが上方修正と自社株買いでストップ高でした。ニデックは半期報告書の提出期限の延長申請を検討中と発表し、軟調でした。\n- ドル円は159.52円(東京17時)です。\n\n**7-9月期GDP(内閣府の1次速報)**\n- 実質GDPは前期比▲0.0%(年率▲0.1%)で、4四半期ぶりのマイナスでした。名目は+0.4%です。\n- 内訳は個人消費が▲0.3%、設備投資が+1.6%でした。内需は+0.6ポイント、外需は▲0.6ポイントの寄与です。\n- 相場への影響は限られました。日銀の高田委員は「機動的な利上げ」が必要と発言しましたが、こちらも市場の反応は小さめです。12月の日銀利上げ観測はまだ崩れていないと見ています(推測)。\n\n**今週の注目(JST)**\n- **11/17 2:00:** ウォーシュFRB議長の講演。12月FOMCでの利上げ幅を見る手がかりになります。\n- **11/17 22:30:** 米10月小売売上高\n- **11/18 早朝:** NVIDIA決算、説明会は7:00。会社予想は売上1,080億ドル±2%、粗利率74.0%です。市場予想(StoneX)は売上1,088億ドル、EPS 2.47ドルです。会社予想の上限1,101.6億ドルを超えられるかと、暫定CEO体制で出すガイダンスが焦点です。\n- **11/19 4:00:** FOMC議事要旨\n- **11/19:** Anthropic(ANT)の上場予定。仮条件は70〜78ドル、825百万株です。会社による値決めの正式発表はまだです。「78ドルで値決め」という見出しの報道もありますが、記事の本文は仮条件のままで、確認できていません。\n- **11/20 8:30:** 日本10月全国CPI\n\n**日経への影響(推測)**\n- NVIDIA決算が上振れした場合は、先週買われたアドバンテスト・東京エレクトロン・ディスコが戻し、6万円台に戻ると見ています。\n- 下振れした場合は、59,000円台前半まで下がるリスクがあります。\n- 指数が寄与度の大きい値がさ半導体株に偏っているため、どちらに転んでも大きく動きやすい点に注意してください。\n\n**カレンダー:** 変更はありません。今週から来月までの対象イベントは登録済みで、重複も日程変更もありませんでした。\n","summary":{"headline":"日経平均は1,480円安(-2.42%)の59,662円で、1週間ぶりに6万円を割りました。","lead":"AI・半導体株の売りが中心で、NVIDIA決算(11/18早朝 JST)を前に買いにくい状態です。","rest":"200日移動平均線(ロイターによると62,000円台前半)も取り戻せていないため、短期の見方を一段慎重にし、「NVIDIA決算までは弱含み、結果次第で大きく振れる」とします。","stats":[{"label":"日経平均","value":"-2.42%","dir":"dn","sub":"59,662円","tag":""},{"label":"TOPIX","value":"-1.02%","dir":"dn","sub":"3,901.37","tag":""},{"label":"ドル円","value":"159.52円","dir":"fx","sub":"","tag":""}]}},{"date":"2026-11-14","title":"夜の戦略レポート 11/14(土)週まとめ","type":"週まとめ","conclusion":"今週の日経225は、前週の急落から+6.46%と大きく戻しました。","conclusion_full":"今週の日経225は、前週の急落から+6.46%と大きく戻しました。ただ金曜の米国でハイテク株が下げ、大阪の夜間取引も61,000円(-150円)で終えたので、月曜は上値の重いスタートになりそうです。来週の最重要イベントは、11/18 6:20 JSTのNVIDIA決算と、11/19のAnthropic上場です。最大のリスクは金利で、米10年債利回りは週間で約0.3%上がって5.136%、ドル円は159.71円まで上がりました。","markdown":"**夜の戦略レポート 11/14(土)週まとめ**\n\n**結論:** 今週の日経225は、前週の急落から+6.46%と大きく戻しました。ただ金曜の米国でハイテク株が下げ、大阪の夜間取引も61,000円(-150円)で終えたので、月曜は上値の重いスタートになりそうです。来週の最重要イベントは、11/18 6:20 JSTのNVIDIA決算と、11/19のAnthropic上場です。最大のリスクは金利で、米10年債利回りは週間で約0.3%上がって5.136%、ドル円は159.71円まで上がりました。\n\n**A. 企業決算**\n\n過去7日間の確定した動きです。\n- **NVIDIA:** 11/12にファンCEOが辞任し、クレスCFOが暫定CEOに就きました。株価は週間で約-12.75%(報道値)で、6週続けて下落しています。後任は、FTが「ArmのハースCEOに打診」と報じましたが、正式には未定です。\n- **Cisco:** 売上は185億ドル(+24%)、EPSは1.40ドル(予想1.33ドル)で、通期見通しを上方修正しました。ただ粗利率が下がり、株価の反応は弱めでした。\n- **CoreWeave:** 売上は36.61億ドル(+168%)、通期の売上見通しを130〜133億ドルに上方修正し、受注残は1,325億ドルです。それでも週後半はNVIDIA不安で売られました。\n- **Nebius:** データセンターの完成が遅れ、2026年の売上見通しを30〜32億ドル(従来30〜34億ドル)に下げました。株価は-18%です。AIインフラ企業でも、設備の供給制約が業績に響き始めています。\n- **ソフトバンクグループ:** 中間期は7,680億円の純損失で、米データセンター用の発電設備に絡む損失5,972億円が響きました。\n- **三菱UFJ・みずほ:** 三菱UFJは通期純益の目標を2.7兆円から2.8兆円に上げ、2,000億円の自社株買いも発表しました。みずほも1.4兆円から1.6兆円に上方修正しています。金利上昇の恩恵がはっきり出ています。\n\n今後30日の注目決算です。\n- **NVIDIA:** 11/18 6:20に発表、7:00から説明会(JST)。売上の市場予想は約1,090億ドル(報道ベース)です。暫定CEOのもとで出すガイダンスと、中国向け輸出への言及が焦点です。\n- **Walmart:** 11/19朝(米国時間)。米国の消費の強さを見る材料です。\n- **Salesforce:** 12/2、米国の引け後。\n- **Broadcom:** 12/10 7:00 JST(公式発表で確認)。NVIDIAから流れた資金の受け皿になれるかを試す場です。\n- **Oracle・Micron:** 日付(12/14、12/23)は予想サイトの情報だけで、公式発表はまだです。\n\n**B. セクター動向**\n- **値動き:** 日本は電機と金融を中心に全面的に戻し、9日は225銘柄中208銘柄が上がりました。米国はS\u0026P500が+2.51%、Nasdaqが+2.27%で、ともに4週続いた下落を止めています。金曜はハイテクが-1.7%だった一方、生活必需品は+1.39%、エネルギーは+0.96%でした。\n- **実際の資金の流れ(確定値):** 11/2〜6の海外投資家は、現物株を714億円売り越し(2週連続)、先物を577億円買い越しで、差し引き137億円の売り越しでした。今週の反発に本物の資金流入が伴っていたかは、来週の投資部門別統計で確認します。\n- **注目業界:** 1つ目は銀行で、金利上昇がそのまま増益につながっており、業績の確度が高い分野です(リスクは景気減速による貸倒れの増加)。2つ目はNVIDIA以外のAI半導体(AMD、Broadcom)で、CEO交代の空白期間に顧客が分散する可能性があります(推測)。3つ目は電力・データセンターで、需要は強いものの、設備の完成遅れや発電設備の調達が制約になっています。\n\n**C. 重点テーマ**\n- **AI・半導体:** NVIDIAの経営体制とAnthropicのIPOが、AI相場への信頼を試します。日経では寄与度の大きいアドバンテスト、東京エレクトロン、ソフトバンクグループが中心で、指数の振れも大きくなりやすい状態です。\n- **金利・インフレ:** 米10月CPIは前月比+0.4%(コア+0.3%)で予想を上回り、PPIは+0.3%で予想の+0.4%を下回りました。\n- **為替:** ドルは19か月ぶりの高値です。ドル円が160円台に乗ると、為替介入への警戒が強まります。\n- **エネルギー:** Brentは95.84ドル(週間-2.52%)、WTIは88.56ドルです。10月末の117ドル台から大きく下がり、空運などのコストには追い風です。OPECプラスの会合は11/29です。\n- **金・暗号資産:** 金は3,886.3ドルで横ばいです。ビットコインは約6.7〜6.8万ドルで、10月末の約7.7万ドルから下がり、高金利が逆風になっています。\n- **防衛・原子力・宇宙・医療・ロボティクス:** 今週は大きな新材料を確認できませんでした。\n\n**D. 経済・政策イベント(JST)**\n- 11/16 8:50: 日本7-9月期GDP(1次速報)、予想は前期比年率+0.3%\n- 11/17 22:30: 米10月小売売上高\n- 11/18 6:20: NVIDIA決算。同日(米国時間)にAnthropicの価格決定。「78ドルで決定」との報道もありますが、正式な決定は11/18の予定です。\n- 11/19: Anthropic(ANT)がNasdaqに上場。4:00にFOMC議事要旨\n- 11/20 8:30: 日本10月全国CPI\n- 11/25 22:30: 米10月PCE\n- 11/29: OPECプラス会合\n- 12/2: 米ISM製造業\n- 12/4: 米11月雇用統計\n- 12/10: 4:00にFOMC(0.25%利上げはほぼ完全に織り込み済み、0.5%は約14〜15%)、7:00にBroadcom決算、22:30に米11月CPI\n- 12/17: ECB\n- 12/18: 日銀(時刻未定、1.50%への利上げを約72.5%織り込み)\n\n**E. まとめ**\n- **最も強気な業界:** 銀行です。金利上昇による増益と、株主還元の上積みが確定値で出ています。\n- **最大のリスク:** 日米の同時利上げと米長期金利5%台が、NVIDIAの経営空白によるAI相場の調整と重なることです。\n- **注目企業5社:** NVIDIA、アドバンテスト、ソフトバンクグループ、三菱UFJ、Broadcom\n- **重要テーマ3つ:** AIのリーダー交代(NVIDIA・Anthropic)、日米の利上げとドル高・円安、AIインフラの供給制約(電力・データセンター)\n- **強気に転じる条件:** NVIDIAが強いガイダンスを出して後任CEOを早く決め、Anthropicの初値も堅調な場合です。日経が6万2,000円台(200日線付近)を回復できるかがポイントです。\n- **弱気に転じる条件:** NVIDIAのガイダンスが弱い、ANTが公開価格を割る、米10年債が5.2%を超える、ドル円が160円を超えて介入が入る、のいずれかです。\n- **来週の日経の予想レンジ:** 約59,500〜63,500円です(報道ベースのコンセンサス)。\n\n**副業へのヒント(推測)**\nAIエージェントを導入したい需要は強まる一方で、計算資源のコストは上がっています(AnthropicはQ3の計算費が売上の58%)。そのため、自分で計算資源を大量に使う事業より、既存のAIを業務テンプレートや自動化ノウハウとしてまとめたストック型のデジタル商品の方が有利だと考えます。\n\n**カレンダー:** 新規1件(【決算】Broadcom 12/10 7:00 JST)、更新はありません。OracleとMicronは公式の日付が出ていないため、登録を見送りました。\n","summary":{"headline":"今週の日経225は、前週の急落から+6.46%と大きく戻しました。","lead":"ただ金曜の米国でハイテク株が下げ、大阪の夜間取引も61,000円(-150円)で終えたので、月曜は上値の重いスタートになりそうです。来週の最重要イベントは、11/18 6:20 JSTのNVIDIA決算と、11/19のAnthropic上場です。","rest":"最大のリスクは金利で、米10年債利回りは週間で約0.3%上がって5.136%、ドル円は159.71円まで上がりました。","stats":[{"label":"Nasdaq","value":"+2.27%","dir":"up","sub":"","tag":""},{"label":"S\u0026P500","value":"+2.51%","dir":"up","sub":"","tag":""},{"label":"ドル円","value":"159.71円","dir":"fx","sub":"","tag":""}]}},{"date":"2026-11-13","title":"夜の戦略レポート 11/13(金)、前日からの変化点","type":"日次","conclusion":"NVIDIAのファンCEO辞任は「売り一巡」と受け止められ、日経平均は反発しました。","conclusion_full":"NVIDIAのファンCEO辞任は「売り一巡」と受け止められ、日経平均は反発しました。ただ後場に上げ幅の約3分の2を失っていて、本当の分かれ目は11/18朝(JST)のNVIDIA決算です。それまではAI半導体株の値動きが荒く、資金がNVIDIAからAMD・ブロードコム・ネットワーク関連へ移るかが焦点になります。一方、邦銀は金利上昇の恩恵で上方修正が相次ぎ、日経平均の下支え役として存在感が増しています。","markdown":"**夜の戦略レポート 11/13(金)、前日からの変化点**\n\n**結論:** NVIDIAのファンCEO辞任は「売り一巡」と受け止められ、日経平均は反発しました。ただ後場に上げ幅の約3分の2を失っていて、本当の分かれ目は11/18朝(JST)のNVIDIA決算です。それまではAI半導体株の値動きが荒く、資金がNVIDIAからAMD・ブロードコム・ネットワーク関連へ移るかが焦点になります。一方、邦銀は金利上昇の恩恵で上方修正が相次ぎ、日経平均の下支え役として存在感が増しています。\n\n**日本市場(確定値)**\n- 日経225は61,142.35円(+322.99円、+0.53%)、TOPIXは3,941.57(+0.11%)で5日続伸でした。\n- 前引けは+997円でしたが、後場に674円縮みました。アドバンテストの寄与は前引けの+370円から大引けで+135円に縮小しています。ソフトバンクグループは-5.1%(3,547円)、イビデンは-4.1%で押し下げ側でした。\n- 上昇を主導したのは、海外勢の先物買いと円安です。\n\n**NVIDIA(会社公式、11/12)**\n- ファンCEOが即日辞任し、クレスCFOがCFOのまま暫定CEOに就きました。取締役会議長にはジョーンズ氏が就任します。\n- 決算は予定どおり11/18 6:20頃(JST)に発表され、説明会は7:00(JST)です。\n- 株価は-4.34%の166.19ドルで、一時52週安値まで下げてから戻しました。AMDは+5.86%、ブロードコムは+5.54%です。\n\n**米国株(11/12)**\nダウは52,297(-189)、S\u0026P500は7,592(-0.35%)、Nasdaqは25,366(-0.39%)で、SOXは-0.5%にとどまりました。長期金利の上昇、12月FOMCでの追加利上げへの警戒、イラン情勢を受けた原油高が重しです。\n\n**Cisco決算(会社公式)**\n- 売上は185億ドル(+24%、予想181億ドル)、調整後EPSは1.40ドル(予想1.33ドル)でした。\n- 通期ガイダンスは、売上748〜758億ドル、EPS 5.47〜5.53ドルに引き上げています。ハイパースケーラー(大手クラウド事業者)向けAIインフラ売上の見通しも、90億ドルへ倍増させました。\n- 一方で粗利率は65.6%(前年比-2.5ポイント)に下がり、時間外とプレマーケットでは軟調です。AI投資の裾野は広がっていますが、メモリ価格の高騰で利益率が圧迫されている形です。\n\n**邦銀の決算**\n- 三菱UFJは通期純益の予想を2.7兆円から2.8兆円に引き上げ、2,000億円の自社株買いと増配を発表しました。\n- みずほは通期純益の予想を1.4兆円から1.6兆円に引き上げ、増配と自社株買いを発表しています。\n- 三井住友は上期純益が1兆31億円で、初めて1兆円台に乗りました。通期の上方修正幅2,000億円のうち950億円は、国内政策金利の前提を0.75%から1.25%に見直した効果です。\n\n**Anthropic IPO**\n値決めは11/18、取引開始は11/19(ティッカーANT)と会社側が発表したと、Yahoo Financeが報じています。FTは、需要超過で仮条件の70〜78ドルが引き上げられる可能性を伝えていますが、まだ観測の段階です。\n\n**見通しが変わる条件(推測)**\n- NVIDIAが決算で強い来期ガイダンスを出し、顧客やロードマップに変化がないと示せば、アドバンテストと東京エレクトロンが買われ、日経平均は再び6.2万円台をうかがえると見ています。\n- ガイダンスが慎重だったり、後任CEO選びが混乱したりすれば、11/6のような半導体主導の急落リスクが再燃します。\n\n**カレンダー:** 新規0件、更新1件です。NVIDIA決算の予定の説明欄に、CEO交代と注目点を追記しました。\n","summary":{"headline":"NVIDIAのファンCEO辞任は「売り一巡」と受け止められ、日経平均は反発しました。","lead":"ただ後場に上げ幅の約3分の2を失っていて、本当の分かれ目は11/18朝(JST)のNVIDIA決算です。それまではAI半導体株の値動きが荒く、資金がNVIDIAからAMD・ブロードコム・ネットワーク関連へ移るかが焦点になります。","rest":"一方、邦銀は金利上昇の恩恵で上方修正が相次ぎ、日経平均の下支え役として存在感が増しています。","stats":[{"label":"日経平均","value":"+0.53%","dir":"up","sub":"61,142.35円","tag":""},{"label":"TOPIX","value":"+0.11%","dir":"up","sub":"3,941.57","tag":""},{"label":"Nasdaq","value":"-0.39%","dir":"dn","sub":"25,366","tag":""},{"label":"S\u0026P500","value":"-0.35%","dir":"dn","sub":"7,592","tag":""},{"label":"ダウ","value":"52,297","dir":"dn","sub":"-189","tag":""},{"label":"SOX","value":"-0.5%","dir":"dn","sub":"","tag":""}]}},{"date":"2026-11-12","title":"夜の戦略レポート 11/12(木)、前日からの変化点","type":"日次","conclusion":"今日の最大の変化は、NVIDIAのファンCEOの解任観測です。","conclusion_full":"今日の最大の変化は、NVIDIAのファンCEOの解任観測です。日経平均は前場の+465円から一転して反落し、AI半導体株の「指導者リスク」が新たな下押し材料になりました。一方で内需株とTOPIXはプラスを保っており、資金は市場から出ておらず、半導体から内需・ディフェンシブへ移っている形です。","markdown":"**夜の戦略レポート 11/12(木)、前日からの変化点**\n\n**結論:** 今日の最大の変化は、NVIDIAのファンCEOの解任観測です。日経平均は前場の+465円から一転して反落し、AI半導体株の「指導者リスク」が新たな下押し材料になりました。一方で内需株とTOPIXはプラスを保っており、資金は市場から出ておらず、半導体から内需・ディフェンシブへ移っている形です。\n\n**日本市場(確定値)**\n- 日経225の終値は60,819.36円(-429.23円、-0.70%)で、4日ぶりに反落しました。高値は61,788円(11:19)、安値は60,643円(14:46)です。TOPIXは3,937.33(+7.94)と小幅高で、値上がり153銘柄、値下がり72銘柄でした。\n- 大引けの寄与度は、マイナス側がアドバンテスト-314円、リクルート-100円、イビデン-78円、ソフトバンクグループ-39円です。アドバンテストとリクルートの2銘柄だけで約414円押し下げました。プラス側はコナミ+17円、東京エレクトロン+16円、KDDI+16円、セコム+15円、JT+15円でした。\n- 前引けでは東京エレクトロンが+205円、ソフトバンクグループが+70円の寄与でしたが、大引けにかけて大きく縮みました。後場に半導体株が売り直された形です。\n- 10月の国内企業物価指数は前年比+7.1%で、予想の+6.5%を上回りました。ドル円は159円台後半です。日銀の12月利上げ観測を後押しする材料になります。\n\n**米国・NVIDIA**\n- 11/11の米国株は、ダウが52,486(+0.5%)、S\u0026P500が7,619(+1.3%、最高値まで2.6%)、Nasdaqが25,466(+1.6%、選挙後の下げを解消)、SOXが+5.66%でした。CoreWeaveは+24%、Micronは+11.9%です。\n- 引け後にNYTがファン氏の2件目の不倫(部下が相手)を報じ、WSJは取締役会が解任を準備していると報じました。取締役会が11/11に会合を開いたことは、CNBCが確認しています。会社の正式発表はまだありません。\n- NVIDIAは時間外で-8〜9%、プレマーケットで-5〜7%です。AMDとAVGOはプレマーケットで+3〜4%でした。目標株価は、Bernsteinが400ドルから200ドル、Citiが285ドルから225ドルに引き下げています。アナリストからは「解任なら20%下落」との見方が出ています。ここは推測です。\n- 欧州ではDAXが初めて27,000を超えました。シーメンスが最高益で+4%です。\n\n**日経への推定影響(推測)**\n今後48時間ほどで、NVIDIAが結論を出す可能性があります。解任となれば、アドバンテスト・イビデン・東京エレクトロンなどNVIDIA関連で、さらに数百円規模の押し下げが起き得ます。続投でも不透明感は残ります。今夜のアプライド・マテリアルズとCisco(11/13 6:30 JST)の決算が、明日の東京の半導体株の方向を決めるもう一つの材料です。\n\n**Anthropic IPO**\n仮条件70〜78ドルで、数倍の応募超過と報じられています(Bloomberg経由)。値決めは米11/18、上場は11/19の予定で、既登録の日程から変更はありません。11/13にはアモデイCEOとJPモルガンのダイモンCEOのライブ配信があります。\n\n**見通しが変わる条件:** NVIDIA取締役会の発表(解任か続投か、暫定CEOは誰か)、アプライド・マテリアルズとCiscoのガイダンス、明夜22:30の米10月PPIです。\n\n**カレンダー:** 変更なしです。\n","summary":{"headline":"今日の最大の変化は、NVIDIAのファンCEOの解任観測です。","lead":"日経平均は前場の+465円から一転して反落し、AI半導体株の「指導者リスク」が新たな下押し材料になりました。一方で内需株とTOPIXはプラスを保っており、資金は市場から出ておらず、半導体から内需・ディフェンシブへ移っている形です。","rest":"","stats":[{"label":"日経平均","value":"-0.70%","dir":"dn","sub":"60,819.36円","tag":""},{"label":"TOPIX","value":"3,937.33","dir":"up","sub":"+7.94","tag":""},{"label":"Nasdaq","value":"+1.6%","dir":"up","sub":"25,466","tag":"11/11"},{"label":"S\u0026P500","value":"+1.3%","dir":"up","sub":"7,619","tag":"11/11"},{"label":"ダウ","value":"+0.5%","dir":"up","sub":"52,486","tag":"11/11"},{"label":"SOX","value":"+5.66%","dir":"up","sub":"","tag":"11/11"}]}},{"date":"2026-11-11","title":"夜の戦略レポート 11/11(水)、前日からの変化点","type":"日次","conclusion":"米国のインフレは予想より強く、12月の利上げはほぼ確定しました。","conclusion_full":"米国のインフレは予想より強く、12月の利上げはほぼ確定しました。一方で、AI関連の悪材料には底打ちの兆しが出ています(CoreWeaveの好決算と、Anthropic IPOの日程の具体化)。日経平均は需給の改善で3日続伸しましたが、来週は11/18朝(JST)のNVIDIA決算、11/19のAnthropic上場と、AI関連の大きな試練が続きます。","markdown":"**夜の戦略レポート 11/11(水)、前日からの変化点**\n\n**結論:** 米国のインフレは予想より強く、12月の利上げはほぼ確定しました。一方で、AI関連の悪材料には底打ちの兆しが出ています(CoreWeaveの好決算と、Anthropic IPOの日程の具体化)。日経平均は需給の改善で3日続伸しましたが、来週は11/18朝(JST)のNVIDIA決算、11/19のAnthropic上場と、AI関連の大きな試練が続きます。\n\n**1. 日経平均(確定値)**\n- 終値は61,248.59円(+789.01円、+1.31%)で3日続伸、TOPIXは3,929.39(+0.92%)でした。\n- 前引け時点の寄与度は、アドバンテストが約+122円、ソフトバンクグループが約-86円です。ソフトバンクグループは中間期の赤字(純損失7,680億円)で一時10%超下げましたが、後場はプラスに転じました。大引けの寄与度は確認できていません。\n- 上げた理由は、先週の急落で信用買い残が減り、需給が軽くなったことです(日経報道)。銀行・証券・商社や内需株が先に買われ、半導体株も持ち直しました。KOSPIの上昇も追い風でした。\n\n**2. 米10月CPI(BLS公表の確定値)**\n- 総合は前月比+0.4%(予想+0.3%)、コアは+0.3%(予想+0.2%)で、コアは3か月連続で+0.3%です。前年比は昨年の政府閉鎖の影響で公表されていません。\n- CME FedWatchでは、12/8-9のFOMCでの0.25%利上げがほぼ完全に織り込まれ、0.5%利上げの確率は約13〜15%です(公表前はほぼ0%)。ウォラー理事は公表前に「コアが0.3%前後なら0.5%も検討」と発言していました。\n- 11/10の米国株は、ダウとS\u0026P500がともに-0.3%で、ナスダックも下落しました(終値の下落率は未確認)。米2年債利回りは+0.13〜0.16%、10年債は4.94%前後に上昇し、金は一時-2%の4,057ドルでした。\n- 日本株への影響(推測): 円安は輸出株の支えになりますが、米金利の上昇は値がさのグロース株やハイテク株の重しになります。\n\n**3. CoreWeave Q3決算(会社公表)**\n- 売上は36.61億ドル(前年同期比+168%、予想約35.4〜35.6億ドル)、1株損失は-1.27ドルで予想より小幅でした。受注残は1,325億ドルで、6月末の1,042億ドルから増えています。\n- 通期の売上ガイダンスを130〜133億ドルに引き上げました(従来は120〜130億ドル)。調整後営業利益のガイダンスも12.75〜13.75億ドルに上げ、市場予想の10.7億ドルを上回りました。設備投資は370〜390億ドルです。\n- 株価はプレマーケットで+11%、Nebiusも+10%と、ネオクラウド株全体が反発しました。CDSスプレッドが11%を超えていた信用不安は、ひとまず和らいだ形です。\n- 「AI投資は過剰ではないか」という懸念がいったん和らぎ、アドバンテスト・東京エレクトロンには追い風です(推測)。ただし、利払い負担は大きく(Q4は10.5〜11.5億ドルの見通し)、資金調達のリスクは残っています。\n\n**4. Anthropic IPOの条件が判明**\n- 会社公式(11/10)の発表では、ロードショー開始、8億2,500万株、仮条件は70〜78ドル、ティッカーはNasdaqの「ANT」です。上限で決まれば、調達額は約643億ドル、時価総額は最大約1.4兆ドルになります。\n- 日程は会社の公式発表には書かれていません。Fidelityの案内では値決めが米国11/18夕方(JST 11/19朝)の予定で、CNBC報道では取引開始が米国11/19です。\n- 成功すればAI関連株の地合いが安定するきっかけになり、OpenAIとの比較で評価されるソフトバンクグループにも材料です。一方、大型IPOに資金が吸い寄せられるリスクもあります。\n\n**見通しが変わる条件**\n- 11/18朝(JST)のNVIDIA決算: 売上ガイダンス1,080億ドル±2%に対する着地と、CEOへの調査問題の続報\n- 11/13 22:30の米PPIと11/25 22:30の米PCE(いずれもJST): 強い数字が続けば、12月の0.5%利上げ観測が高まります\n- Anthropicの値決めと初値\n\n**カレンダー:** 新規1件(【IPO】Anthropic 11/19、終日・時刻未定)、更新0件です。NVIDIA決算(11/18 6:20発表、7:00説明会、JST)は登録済みのため、変更していません。\n","summary":{"headline":"米国のインフレは予想より強く、12月の利上げはほぼ確定しました。","lead":"一方で、AI関連の悪材料には底打ちの兆しが出ています(CoreWeaveの好決算と、Anthropic IPOの日程の具体化)。","rest":"日経平均は需給の改善で3日続伸しましたが、来週は11/18朝(JST)のNVIDIA決算、11/19のAnthropic上場と、AI関連の大きな試練が続きます。","stats":[{"label":"TOPIX","value":"+0.92%","dir":"up","sub":"3,929.39","tag":""},{"label":"S\u0026P500","value":"-0.3%","dir":"dn","sub":"","tag":"11/10"}]}},{"date":"2026-11-10","title":"夜の戦略レポート 11/10(火)、前日からの変化点","type":"日次","conclusion":"AI・半導体株の買い戻しが2日目も続き、日経平均は6万円台を回復しました。","conclusion_full":"AI・半導体株の買い戻しが2日目も続き、日経平均は6万円台を回復しました。ただ、今夜22:30 JSTの米10月CPIで、12月の利上げ観測(織り込み約84%)が固まるか崩れるかが決まります。ここが短期の分かれ目です。","markdown":"**夜の戦略レポート 11/10(火)、前日からの変化点**\n\n**結論:** AI・半導体株の買い戻しが2日目も続き、日経平均は6万円台を回復しました。ただ、今夜22:30 JSTの米10月CPIで、12月の利上げ観測(織り込み約84%)が固まるか崩れるかが決まります。ここが短期の分かれ目です。\n\n**日経225(確定値):** 終値は60,459.58円(+1,684.08円、+2.87%)で、終値で6万円台に戻るのは3営業日ぶりです。ソフトバンクグループが+13%超で、1銘柄で約380円押し上げました。アドバンテストと東京エレクトロンも上昇しています。前日の米国株高(S\u0026P500は7,549.94で+2.35%、Nasdaqは25,253.14で+2.74%)と、韓国・台湾のハイテク株高が追い風でした。\n\n**ソフトバンクグループ決算(公式短信):** 4〜9月期の純損失は7,680億円で、前年同期の2兆9,240億円の黒字から赤字に転じました。米国のAIデータセンター向け発電設備の調達見直しで5,972億円の損失を計上し、金融費用は7,907億円に増えています。一方、インテル株で1兆628億円の投資益が出ています。OpenAIへの300億ドルの追加出資は10月で完了し、評価は据え置きです。赤字でも株価が急騰したのは、AI需要への過度な警戒が後退したためです(りそな・武居氏の見方)。\n\n**マクロ**\n- 米イランの緊張緩和への期待から、Brentは90ドル前後まで下落しています。\n- 10月CPIの市場予想は、総合+0.3%、コア+0.2%(いずれも前月比)です。今回は前年比が公表されないため、コアの前月比が唯一の物差しになります(BLS)。\n- ウォラー理事は12月の利上げ支持を明言し、0.5%幅の可能性も排除しませんでした。日銀の10月会合「主な意見」でも利上げを急ぐべきとの意見が複数出ており、日米ともに12月の利上げ観測が強まっています。ドル円は158円前後です。\n- NVIDIAはファンCEOの問題で11/9に-4%となり、11/10のプレマーケットでは+1.7%でした。\n\n**見通しが変わる条件(推測):** コアCPIが+0.3%以上なら、米金利の上昇とドル高で、半導体主導の戻りが止まりやすくなります。+0.2%以下なら、6万円台の定着と、ソフトバンクグループ・アドバンテストの続伸が見込めます。今夜のCoreWeave決算(説明会は11/11 7:00 JST)は、AIインフラ需要が本物かを確かめる最初の材料になります。\n\n**カレンダー:** 新規2件を登録しました(CoreWeaveの11/11 7:00 JST、Ciscoの11/13 6:30 JST)。12/10のFOMCは、今日削除したあと1件だけになっていることを確認しました。\n","summary":{"headline":"AI・半導体株の買い戻しが2日目も続き、日経平均は6万円台を回復しました。","lead":"ただ、今夜22:30 JSTの米10月CPIで、12月の利上げ観測(織り込み約84%)が固まるか崩れるかが決まります。ここが短期の分かれ目です。","rest":"","stats":[{"label":"日経平均","value":"+2.87%","dir":"up","sub":"60,459.58円","tag":""},{"label":"Nasdaq","value":"+2.74%","dir":"up","sub":"25,253.14","tag":""},{"label":"S\u0026P500","value":"+2.35%","dir":"up","sub":"7,549.94","tag":""},{"label":"NVIDIA","value":"-4%","dir":"dn","sub":"","tag":""}]}},{"date":"2026-11-09","title":"夜の戦略レポート 11/9(月)","type":"日次","conclusion":"今日の日経の反発は、自律反発と見るのが妥当です(確定しているのは値幅だけで、解釈は推測です)。","conclusion_full":"今日の日経の反発は、自律反発と見るのが妥当です(確定しているのは値幅だけで、解釈は推測です)。AIデータセンター規制への懸念は消えておらず、明日のソフトバンクグループ決算と米CPI、それにAnthropicのIPOの進み具合が、底入れするかどうかの分かれ目です。","markdown":"**夜の戦略レポート 11/9(月)**\n11/6と11/7のレポートは、Grok Botの利用枠が尽きて実行が止まったため出ていません。今回は11/6の急落も含めて、変化点をまとめています。\n\n**結論:** 今日の日経の反発は、自律反発と見るのが妥当です(確定しているのは値幅だけで、解釈は推測です)。AIデータセンター規制への懸念は消えておらず、明日のソフトバンクグループ決算と米CPI、それにAnthropicのIPOの進み具合が、底入れするかどうかの分かれ目です。\n\n**11/6から今日までの変化点**\n- **11/5の米国(確定):** SOXは-12.25%で2020年3月以来の下げ、Nasdaqは-5.5%、ダウは-1,833ドルでした。主因は、中間選挙で民主党が勝ってデータセンター規制が強まるという警戒で、QCOMとARMの見通しが物足りなかったことも重なりました。ただ、連邦法での規制はフィリバスターと拒否権があって進みにくく、新しい議会も2027年1月からなので、実際の規制は州や地域が中心になるとの見方が多いです。\n- **11/6の日経(確定):** -3,643円(歴代3位の下げ幅)の57,434.77で、値上がりは21銘柄だけでした。10/29の終値から5日間で-7,225円(-11.2%)下げています。\n- **11/6の米雇用統計(BLS):** 雇用者数は+16.5万人と予想の5.9万人を大きく上回り、失業率は4.1%、平均時給は前年比+3.1%でした。米10年債利回りは4.858%と小幅に上がっています。同じ日にSOXは+4.2%、AMDは+11%と反発しましたが、5日の急落前の水準にはまだ約8.6%届いていません。\n- **11/9の日経(確定):** +1,340.73(+2.33%)の58,775.50で、TOPIXも+110.17でした。前引け時点の寄与度は、アドバンテストが+310円、東京エレクトロンが+270円、ファーストリテイリングが+235円です。ソフトバンクグループは3,400円(-4.2%)で6日続落、キオクシアも6日続落でした。日経平均の予想PERは6日に15倍を割っています。\n- **新しく出てきたリスク:** NVIDIAの取締役会が、ジェンスン・ファンCEOと中国の情報工作をめぐる問題について、独立調査を始めたと11/8に公式発表しました。取締役会は「機密が漏れたと考える理由はない」としていますが、株価はプレマーケットで-4〜5%でした。CEOが交代することになれば、日本の半導体株にも下押し要因になります(推測)。\n- **その他の資産(11/9夜時点の概算):** ドル円は約157.9円、金は約4,104ドル(+1.2%)、Brentは100ドルを割って約97ドル、BTCは約74,000ドル(-0.9%)です。\n\n**この先の注目点**\n- 11/10は、15:30にソフトバンクグループの決算短信、16:30に決算説明会があります(会社の公式発表)。焦点はOpenAIの評価や資金調達の見通しです。同じ日にフジクラ、ホンダ、川崎重工も決算を発表し、22:30には米10月CPIが出ます。CPIが上振れすると米長期金利が上がり、ハイテク株の重しになります。\n- AnthropicのIPOは、ロードショーが今週始まる見込みで、最短なら11/13に値決め、11/16に上場です。ただ、公式の日付はまだ出ていません。延期になれば、AI関連株への警戒がもう一段強まる可能性があります(推測)。\n- 11/18早朝のNVIDIA決算が、AIへの設備投資の流れが続くかを確かめる最大の材料です。\n\n**見通しが変わる条件:** ソフトバンクグループとNVIDIAの決算が無事に通過し、AnthropicのIPOも順調に進めば、AI関連株の買い戻しが続く可能性があります。逆に、CPIが上振れするか、IPOが延期されると、二番底を試す展開になりそうです。\n\n**カレンダー:** 新規登録は1件(日本10月全国CPI、11/20 8:30)で、更新とスキップは0件です。AnthropicのIPOは日付が未確定なので登録していません。それから、12/10のFOMCが2件重複して登録されているのを見つけました。まだ削除していません。\n","summary":{"headline":"今日の日経の反発は、自律反発と見るのが妥当です(確定しているのは値幅だけで、解釈は推測です)。","lead":"AIデータセンター規制への懸念は消えておらず、明日のソフトバンクグループ決算と米CPI、それにAnthropicのIPOの進み具合が、底入れするかどうかの分かれ目です。","rest":"","stats":[{"label":"Nasdaq","value":"-5.5%","dir":"dn","sub":"","tag":"11/5"},{"label":"SOX","value":"-12.25%","dir":"dn","sub":"","tag":"11/5"},{"label":"ドル円","value":"157.9円","dir":"fx","sub":"","tag":""}]}},{"date":"2026-11-05","title":"夜の戦略レポート 11/5(木)、変化点のみ","type":"日次","conclusion":"日経225は4日続落で、終値は61,077.90円(-1,110.73円、-1.79%)でした。","conclusion_full":"日経225は4日続落で、終値は61,077.90円(-1,110.73円、-1.79%)でした。5/20以来、約5か月半ぶりの安値です。ただ、TOPIXは3,940.39(+1.16%)と上昇し、値上がり1,127銘柄、値下がり408銘柄でした。下げの中身は、AI・半導体株に偏っていました。","markdown":"**夜の戦略レポート 11/5(木)、変化点のみ**\n\n**結論:** 日経225は4日続落で、終値は61,077.90円(-1,110.73円、-1.79%)でした。5/20以来、約5か月半ぶりの安値です。ただ、TOPIXは3,940.39(+1.16%)と上昇し、値上がり1,127銘柄、値下がり408銘柄でした。下げの中身は、AI・半導体株に偏っていました。\n\n**日経225の実際の寄与度(株探)**\n- **マイナス:** アドバンテスト-1,097円、東京エレクトロン-460円、ソフトバンクグループ-234円、イビデン-177円、TDK-101円です。\n- **プラス:** ファーストリテイリング+295円、コナミ+96円、トヨタ+85円です。\n- 日経は朝方に400円超上げましたが、その後の半導体売りで、下げ幅が一時1,400円を超えました。\n\n**背景(確定事実)**\n- 米中間選挙で民主党が上下両院を制しました。11/4の米国株は、ダウが+3.03%(53,356ドル)、S\u0026P500が+1.58%(7,688.62)、ナスダックが+1.44%でした。\n- 一方でフィラデルフィア半導体指数(SOX)は-3.13%(10,268.65)で、6か月ぶりの安値でした。テキサスなどで民主党の知事が当選し、データセンター建設の規制強化が意識されたためです(ロイター・聯合ニュースの報道)。\n- 資金は選別されています。MSFTは+6.7%、AMZNは+6.1%、GOOGLは+3.2%と上げました。マイクロン-7%、エヌビディア-3.2%、コアウィーブ約-10%と、半導体・データセンター関連は売られました。AI設備投資が減速すれば、大手の資金負担は軽くなる一方、供給側の成長は鈍るという見方です(推測を含む解釈)。\n- 原油は急落し、Brentは-8.6%の94.70ドルでした。米10年債利回りは4.89%に低下しました。\n\n**決算**\n- **トヨタ:** 通期の営業益予想を3.4兆円から3.9兆円に、純益予想を3.25兆円から3.57兆円に上方修正しました。自社株買い枠も1.3兆円に拡大し、株価は+16.7%の3,533円でした。\n- **ソニーグループ:** 通期の純益予想を1.21兆円から1.33兆円に上方修正し、株価は+7.07%でした。\n- **任天堂:** 上期の営業益は+49.1%でしたが、通期予想は据え置きでした。\n\n**見通しの変化**\n日経は半導体株の比重が高いため、SOX安の影響を受けやすい構造です。今夜から先の確認点は次のとおりです。\n- 11/6 22:30 JST: 米10月雇用統計\n- 11/10 15:30 JST: ソフトバンクグループ中間決算\n- 11/10 22:30 JST: 米10月CPI(市場予想は前年比3.7%、コア2.6%で、二次情報です)\n- 11/13 6:30 JST: アプライド・マテリアルズ決算説明会(半導体製造装置の受注見通しは、東京エレクトロン・アドバンテストに直結しやすい材料です)\n\nAnthropic IPOは、上場日・価格帯が未確定です(最短の初取引は11/16、11/16週の報道のみ)。そのため、カレンダーには登録していません。\n\n**カレンダー(`zhishujitian89@gmail.com` のprimary):** 新規2件を登録しました(更新・スキップなし)。\n- 【経済指標】日本7-9月期GDP 1次速報(11/16 8:50 JST)\n- 【決算】アプライド・マテリアルズ FY2026 Q4(説明会 11/13 6:30 JST)\n\nどちらも招待者なし、通知なしです。`jiazuolixuan@gmail.com` 側には触れていません。\n","summary":{"headline":"日経225は4日続落で、終値は61,077.90円(-1,110.73円、-1.79%)でした。","lead":"5/20以来、約5か月半ぶりの安値です。ただ、TOPIXは3,940.39(+1.16%)と上昇し、値上がり1,127銘柄、値下がり408銘柄でした。","rest":"下げの中身は、AI・半導体株に偏っていました。","stats":[{"label":"TOPIX","value":"+1.16%","dir":"up","sub":"3,940.39","tag":""},{"label":"Nasdaq","value":"+1.44%","dir":"up","sub":"","tag":"11/4"},{"label":"S\u0026P500","value":"+1.58%","dir":"up","sub":"7,688.62","tag":"11/4"},{"label":"ダウ","value":"+3.03%","dir":"up","sub":"53,356ドル","tag":"11/4"},{"label":"SOX","value":"-3.13%","dir":"dn","sub":"10,268.65","tag":""},{"label":"NVIDIA","value":"-3.2%","dir":"dn","sub":"","tag":""}]}},{"date":"2026-11-04","title":"夜の戦略レポート 11/4(水)、変化点のみ","type":"日次","conclusion":"日経225は、米中間選挙の結果(民主党が上下両院で優勢)を受けてAI・半導体株が急落し、一時6万円割れ寸前まで売られましたが、引けにかけて急回復しました。","conclusion_full":"日経225は、米中間選挙の結果(民主党が上下両院で優勢)を受けてAI・半導体株が急落し、一時6万円割れ寸前まで売られましたが、引けにかけて急回復しました。終値は62,188.63円(-893.23円、-1.42%)で3日続落、7/30以来の安値水準です。TOPIXは3,895.38(-0.89%)で、6/12以来の安値水準でした。","markdown":"**夜の戦略レポート 11/4(水)、変化点のみ**\n\n**結論:** 日経225は、米中間選挙の結果(民主党が上下両院で優勢)を受けてAI・半導体株が急落し、一時6万円割れ寸前まで売られましたが、引けにかけて急回復しました。終値は62,188.63円(-893.23円、-1.42%)で3日続落、7/30以来の安値水準です。TOPIXは3,895.38(-0.89%)で、6/12以来の安値水準でした。\n\n**日経225への影響(実際の寄与度、大引け時点)**\n- 場中安値は60,030.10円(13:37、下げ幅は約3,000円超)で、そこから約2,000円戻しました。「売り材料が出尽くした」ことと、「トランプ氏が結果を受け入れる姿勢」が買い戻しの理由と日経が報じています。\n- **押し下げ:** アドバンテスト-258.90円(34,570円、-1,200円)、東京エレクトロン-172.93円(9,663円)、ソフトバンクグループ-114.08円(4,269円)、京セラ-65.26円、フジクラ-44.50円、キオクシア-43.18円(10,735円)です。\n- **押し上げ:** ファーストリテイリング+162.62円(77,370円)、三菱商事+38.03円です。値上がり73銘柄(寄与+318.97円)に対し、値下がり150銘柄(寄与-1,212.20円)でした。プライムは値下がり1,084、値上がり425で、売買代金は10.8兆円です。\n- 午前の前引け(60,835円)ではアドバンテスト単独で約-602円でしたが、午後の戻しで約-259円まで縮小しました。\n\n**確定事実と、まだ確定していないこと**\n- 上院は民主党が過半数を確保しました(朝日新聞は51議席以上と報道)。下院も複数の米メディアが民主党の過半数奪還を報じていますが、最終議席は未確定です(過去3回は確定まで約1週間かかりました)。\n- **市場の見立て(推測):** 民主党はAI規制に前向きとされ、AIデータセンター投資が鈍るとの警戒が、AI・半導体株売りの理由とされています。一方で、ドル安と米10年債利回りの低下(約4.89%、-0.07)も出ており、「AI規制の具体策はまだ不明」という見方もあります。選挙だけが原因とは言えず、AI関連の割高感や、直近の決算ショック(AmazonやIntelなど)も背景にあります。\n\n**ほかの相場(参考値、時点が異なる速報)**\n- ドル円は157円台半ば(11/4午後、前日NY終値158.69円)です。NY原油は約96ドル付近で落ち着いています。ビットコインは一時約76,400ドル(-1.8%)でした。\n- 米先物(14時ごろ)は、ナスダック100先物-1.27%、S\u0026P500先物-0.83%まで下げ幅を縮小しています。\n\n**今後の注目(登録済み)**\n- 11/4 22:15 米ADP雇用者数、11/5 0:00 米ISM非製造業、11/5 トヨタ13:55・ソニーG・任天堂(時刻未公表)、11/5 21:00 BoE、11/6 日本製鉄・KDDI、11/6 22:30 米雇用統計、11/10 ソフトバンクグループ決算と米CPIです。ソフトバンクグループは足元の下押し寄与が大きく、要注目です。\n- **見通しが変わる条件:** 米下院の最終議席と民主党の具体的なAI規制案、米10年債利回りの方向、SOX/ナスダックが戻すか、中東情勢(原油)です。\n- Anthropic IPOは最短11/16上場の報道のみで、価格決定日は未確定(S-1/A-1は11/2提出、価格帯は空欄)のため、カレンダー登録は見送りました。\n\n**カレンダー(`zhishujitian89@gmail.com` のprimaryのみ):** 更新1件です。トヨタ決算を、終日・時刻未定から11/5 13:55 JST開示に更新しました(時事通信の10/29報道に基づきます)。新規は0件、スキップは1件で、任天堂は公式IRカレンダーに時刻の記載がなく、終日・時刻未定のままです。\n","summary":{"headline":"日経225は、米中間選挙の結果(民主党が上下両院で優勢)を受けてAI・半導体株が急落し、一時6万円割れ寸前まで売られましたが、引けにかけて急回復しました。","lead":"終値は62,188.63円(-893.23円、-1.42%)で3日続落、7/30以来の安値水準です。TOPIXは3,895.38(-0.89%)で、6/12以来の安値水準でした。","rest":"","stats":[{"label":"TOPIX","value":"-0.89%","dir":"dn","sub":"3,895.38","tag":""}]}},{"date":"2026-11-03","title":"夜の戦略レポート 11/3(火)、変化点のみ","type":"日次","conclusion":"東証は文化の日で休場でした。明日11/4の寄りは、「ナスダック続落と半導体安」と「原油急落」の綱引きで、中間選挙の開票結果が最大の変数です。","conclusion_full":"東証は文化の日で休場でした。明日11/4の寄りは、「ナスダック続落と半導体安」と「原油急落」の綱引きで、中間選挙の開票結果が最大の変数です。日経225先物は夜間(11/3朝6時終了時点)で62,780円(-480円)で、11/2終値63,081.86円からは約300円安です。見通しレンジはマネックスの予想で6.15〜6.45万円、下の目安は200日線の約61,957円(民間試算)です。","markdown":"**夜の戦略レポート 11/3(火)、変化点のみ**\n\n**結論:** 東証は文化の日で休場でした。明日11/4の寄りは、「ナスダック続落と半導体安」と「原油急落」の綱引きで、中間選挙の開票結果が最大の変数です。日経225先物は夜間(11/3朝6時終了時点)で62,780円(-480円)で、11/2終値63,081.86円からは約300円安です。見通しレンジはマネックスの予想で6.15〜6.45万円、下の目安は200日線の約61,957円(民間試算)です。\n\n**11/2(月)の米国市場(日本時間11/3朝)**\n- ダウは51,983.98(+0.41%)、S\u0026P500は7,541.40(-0.51%)、ナスダックは25,164.32(-1.07%)で、ナスダックは10月に-5.2%でした。オラクルが200億ドルの調達を発表して-5%となり、AI投資の資金調達負担への警戒が続いています。\n- SOX(半導体株指数)は-3.5%でした(単一の民間報道)。キオクシア・アドバンテスト・東京エレクトロン・ソフトバンクグループは、明日安く始まる公算が大きいです。\n- 米10月ISM製造業は55.5で予想54.5を上回り、7月以来の高水準でした。支払価格は75.2(9月77.9)に低下しています。9月の建設支出は-1.9%(予想+0.3%)でした。\n- 原油が急落し、WTIは96.46ドル(-7.36%)、Brentは104.77ドル(-7.63%)でした。米イラン外交協議への期待が背景です。10年債は約4.89%、ドル円は157円台後半〜158円近辺、金は3,969.6ドル(+70.7ドル)です。\n- 日経への影響は、原油安が空運・陸運・化学の追い風、石油・資源の逆風という見立てです(推定。実際の寄与度は明日の取引後に確定します)。\n\n**決算(確定した事実)**\n- **Apple(FY26 Q4):** 売上1,145億ドル、EPS 2.10ドルで予想を上回りました。ただ、中国売上175億ドルは予想に届かず、フリーキャッシュフロー268億ドルも予想を下回っています。次四半期の粗利益率見通し45〜46%は予想の47%を下回り、時間外は小幅安です。メモリ価格の高騰が利益率の論点になっています。\n- **Palantir(Q3):** 売上23.13億ドル(+96%、予想21.8億)、調整後EPS 0.44ドル(予想0.41)でした。米国商用売上が米政府売上を初めて上回っています(9.84億ドル対9.53億ドル)。Q4売上見通し26.49〜26.53億ドルは予想24.6億ドルを大幅に超え、通期売上見通しも85.30〜85.34億ドルに上方修正しました。それでも時間外は-3%前後(報道により+1%の記述もあり、暫定)で、好決算でも買われにくい地合いです。\n\n**これから(JST)**\n- 11/4 0:00 米JOLTS求人(市場予想716万件前後)、朝7:00にAMD決算、日中は三菱商事の決算です。\n- **米中間選挙:** 開票は日本時間11/4未明からです。下院は民主党の奪還が優勢予想、上院は拮抗しています。民主党が両院を制するとAI・半導体規制の思惑が出る一方、メインシナリオなのである程度織り込み済みとの見方もあります(マネックス)。選挙後のイラン再攻撃の思惑(原油高・ドル高要因)にも注意が必要です。\n- 11/5 トヨタ・任天堂・ソニー決算とBoE、11/6 22:30に米10月雇用統計(市場予想は雇用者+5.5万人、失業率4.2%)と三菱重工決算、11/10 ソフトバンクグループ決算と米CPIです。いずれも登録済みです。\n\n**Anthropic IPO:** 10/26に公開したS-1に11/2に修正第1号を提出しましたが、価格帯・株数は空欄のままです。ロードショーは11/9〜10、上場は11/16〜20ごろとの報道止まりで、確定した日付がないためカレンダー登録は見送りました。\n\n**見通しが変わる条件:** 民主党が両院を制してAI規制観測が強まる場合や、イラン再攻撃で原油が反転上昇する場合は下振れです。AMD決算でAI需要の底堅さが確認され、半導体が下げ止まる場合は反発します。\n\n**カレンダー:** 変更なしです(新規0・更新0・スキップ0)。対象の既存イベントはすべて登録済みで、Apple・Palantirの決算結果も説明欄に反映済みです。\n","summary":{"headline":"東証は文化の日で休場でした。","lead":"明日11/4の寄りは、「ナスダック続落と半導体安」と「原油急落」の綱引きで、中間選挙の開票結果が最大の変数です。日経225先物は夜間(11/3朝6時終了時点)で62,780円(-480円)で、11/2終値63,081.86円からは約300円安です。","rest":"見通しレンジはマネックスの予想で6.15〜6.45万円、下の目安は200日線の約61,957円(民間試算)です。","stats":[{"label":"Nasdaq","value":"-1.07%","dir":"dn","sub":"25,164.32","tag":""},{"label":"S\u0026P500","value":"-0.51%","dir":"dn","sub":"7,541.40","tag":""},{"label":"ダウ","value":"+0.41%","dir":"up","sub":"51,983.98","tag":""},{"label":"SOX","value":"-3.5%","dir":"dn","sub":"","tag":""},{"label":"先物","value":"62,780円","dir":"flat","sub":"","tag":""}]}},{"date":"2026-11-02","title":"夜の戦略レポート 11/2(月)、10/31からの変化点","type":"日次","conclusion":"1. AI・半導体株は全面安ではなく、決算の中身で選ばれる局面に入っています。","conclusion_full":"1. AI・半導体株は全面安ではなく、決算の中身で選ばれる局面に入っています。ガイダンスが予想を上回った東京エレクトロンは買われ、下回ったキオクシアとIntelは大きく売られました。日経225は少数の値がさ株の決算でほぼ決まっています。\n2. 最大のリスクは引き続き「AI設備投資は回収できるのか」という懸念です。そこにOpenAIの資金調達縮小の報道が重なり、ソフトバンクグループ(11/10決算)に波及しやすい状態です。\n3. 原油が下がり続ければ、インフレと利上げ観測が後退して株の追い風になります。ただ、米国とイランの交渉はまだ確定していません。","markdown":"**夜の戦略レポート 11/2(月)、10/31からの変化点**\n\n**結論の更新**\n1. AI・半導体株は全面安ではなく、決算の中身で選ばれる局面に入っています。ガイダンスが予想を上回った東京エレクトロンは買われ、下回ったキオクシアとIntelは大きく売られました。日経225は少数の値がさ株の決算でほぼ決まっています。\n2. -31","type":"週まとめ","conclusion":"日経225の今週の結果(確定): 63,290.11円で、週間では+597円(+0.95%)でした。","conclusion_full":"- **日経225の今週の結果(確定):** 63,290.11円で、週間では+597円(+0.95%)でした。上げ下げの大部分は少数の値がさ半導体株によるもので、市場全体の強さはそれほどでもありません(TOPIXは3,965.07、10/30は-0.95%)。\n- **週明けの見通し(推定):** CME日経平均先物12月限は62,600円で引けました。大阪取引所の日中比で-890円、現物終値と比べると約-690円です。10/30の米ハイテク株の急落分が、11/2(月)の寄り付きに反映される可能性が高いと見ています。これは推定で、実際の寄与度ではありません。\n- **最大のリスク:** 二つの懸念が同時に進んでいます。一つは「AI投資が回収できず、現金を使い果たしているのでは」という見方で、Alphabet・Amazon・Intelの決算がきっかけです。もう一つはBrent原油の117ドル台への上昇で、11/3の米中間選挙の後にイランとの衝突が再燃する懸念が背景にあります。\n- **最も強気な業界(中期):** AIデータセンター向けのメモリーと半導体検査装置です。キオクシアは「来年の生産能力はほぼ売り切れ」と述べ、アドバンテストは業績予想を上方修正しました。ただ足元の株価は売られており、業績と株価の向きが一致していません。\n- **来週の焦点:** 11/3 7:00のApple決算と米中間選挙(11/3は文化の日で東京市場は休場)、11/4 7:00のAMD決算、11/6 22:30の米10月雇用統計です。","markdown":"## 夜の戦略レポート(土曜版・週のまとめ) 2026-10-31\n\n### 結論\n- **日経225の今週の結果(確定):** 63,290.11円で、週間では+597円(+0.95%)でした。上げ下げの大部分は少数の値がさ半導体株によるもので、市場全体の強さはそれほどでもありません(TOPIXは3,965.07、10/30は-0.95%)。\n- **週明けの見通し(推定):** CME日経平均先物12月限は62,600円で引けました。大阪取引所の日中比で-890円、現物終値と比べると約-690円です。10/30の米ハイテク株の急落分が、11/2(月)の寄り付きに反映される可能性が高いと見ています。これは推定で、実際の寄与度ではありません。\n- **最大のリスク:** 二つの懸念が同時に進んでいます。一つは「AI投資が回収できず、現金を使い果たしているのでは」という見方で、Alphabet・Amazon・Intelの決算がきっかけです。もう一つはBrent原油の117ドル台への上昇で、11/3の米中間選挙の後にイランとの衝突が再燃する懸念が背景にあります。\n- **最も強気な業界(中期):** AIデータセンター向けのメモリーと半導体検査装置です。キオクシアは「来年の生産能力はほぼ売り切れ」と述べ、アドバンテストは業績予想を上方修正しました。ただ足元の株価は売られており、業績と株価の向きが一致していません。\n- **来週の焦点:** 11/3 7:00のApple決算と米中間選挙(11/3は文化の日で東京市場は休場)、11/4 7:00のAMD決算、11/6 22:30の米10月雇用統計です。\n\n### 週次の数値(10/30終値)\n- **日経225:** 63,290.11(週間+0.95%)。CME先物12月限は62,600です。\n- **米国株:** S\u0026P500は7,580.07(-1.82%)で、6月以来最悪の1日となり、3週続落です。Nasdaq総合は25,437.00(-2.86%)で、10/6の最高値から-7.8%です。SOX(フィラデルフィア半導体株指数)はこの日-7.2%、10月の月間で-15%超でした。\n- **米国債:** 10年債利回りは4.931%(-5.8bp)、2年債利回りは4.59%です。\n- **為替:** ドル円は157.54です。\n- **原油:** Brentは117.64ドル、WTIは104.12ドルで、6か月ぶりの高値です。\n- **BTC:** 約77,370ドル(10/31時点)です。\n\n### A. 企業決算\n**過去7日間**\n- **Intel:** Q4ガイダンスは売上150〜160億ドル(予想171億ドル)、調整後EPS 0.25ドル(予想0.43ドル)で、どちらも予想を下回りました。原因はイスラエル工場の停止とPC需要の不振で、CFOは「PCの減速は来年上期まで続く」と述べています。株価は-28.6%で、1974年以来最悪の下落でした。\n- **Amazon:** EPSは1.89ドルで予想に届かず、売上は2,019億ドル、AWSは+39%でした。設備投資計画2,200億ドルは据え置きです。10/30の終値は-1.41%で、時間外の-6〜7%から下げ幅を縮めました。\n- **Alphabet:** 10/29に-12.6%、10/30にさらに-1.4%でした。AI投資でフリーキャッシュフローがマイナスに転じたことが嫌われています。\n- **Microsoft:** Azureが+48%で好調でした。\n- **石油大手:** Exxonは利益が2倍超の154億ドルで株価+2.2%、Chevronも予想を上回り+2.8%でした。\n- **キオクシア:** 4〜9月期は純利益2兆1,978億円(37倍)で過去最高でした。ただ、10〜12月期の営業益見通しは2兆円で、予想の2.32兆円を下回りました。株主還元は「余剰キャッシュの100%を充当」する方針です。決算を受けた株価の反応は11/2に出ます。\n- **その他の国内:** アドバンテストは通期営業益を9,670億円に上方修正し、2,800億円の自社株買いを発表しました。東京エレクトロンは通期の営業益予想1.169兆円を初めて開示し、1,500億円の自社株買いも発表しています。イビデンは上方修正しましたがストップ安でした。\n\n**今後30日の注目決算**\n- 11/3 7:00 Apple(EPS予想1.98ドル、新CEOのTernus氏にとって初の決算)\n- 11/4 7:00 AMD\n- 11/5 トヨタ・任天堂(時刻未定)、ソニー(15:30)\n- 11/10 15:30 ソフトバンクG\n- 11/18 7:00 NVIDIA\n\n### B. セクター動向\n- **値動き(確定):** 半導体、サーバー(Dell -10.8%)、ハイテク株が売られ、エネルギー、生活必需品、公益が買われました。債券は安全資産として買われています。\n- **実際の資金フロー:** 投資主体別売買動向などのデータは取れていないため不明です。上の流入・流出は値動きからの推測です。\n- **注目の業界**\n  1. **AIメモリー:** 販売単価は前四半期比+20%台半ばと強い一方、10〜12月期は+1%台に鈍化する見込みです。\n  2. **エネルギー:** 業績は好調ですが、イランとの和平が成立すると原油が急落するリスクがあります。\n  3. **半導体製造装置:** 受注と自社株買いは強いものの、株価は米SOX指数の動きに強く連動します。\n\n### C. 重点テーマ\n- **AI・半導体:** 売上の伸びは確認されていますが、AI投資の採算が問われる局面に入りました。11/18のNVIDIA決算が最大の試金石です。\n- **エネルギー・インフレ:** 10/30にホルムズ海峡でタンカー攻撃がありました。11/1にOPEC+の会合があります。原油高はインフレ再燃につながり、金利が下がりにくくなる要因です。\n- **金利:** FOMCは3.75〜4.00%に据え置きましたが、反対した2人は利上げを主張していました。12月の利上げ観測と、景気減速懸念による金利低下の綱引きが続いています。\n- **円:** 日銀は1.25%に据え置きましたが、物価見通しを上方修正しました。12/18の会合で利上げがあれば円高要因になります。\n- **暗号資産:** 10/30にBinanceが63億ドル規模のハッキングを公表しました。北朝鮮の関与が報道されており、Binanceは出金を停止したうえで利用者の損失を補償すると表明しています。BTC自体のネットワークは侵害されていません。\n- **防衛・電力・原子力・医療・ロボティクス・宇宙:** 今週は新しい一次情報がありませんでした。\n\n### D. 来週〜来月のイベント(日本時間)\n- 11/1 OPEC+会合(時刻未定)\n- 11/3 0:00 米ISM製造業、同日に米中間選挙、7:00 Apple決算\n- 11/4 7:00 AMD決算\n- 11/5 21:00 英中銀(BoE)\n- 11/6 22:30 米10月雇用統計\n- 11/10 22:30 米10月CPI\n- 11/13 22:30 米PPI\n- 11/16の週 Anthropic上場予定の報道あり(日付は未確定)\n- 11/17 22:30 米小売売上高\n- 11/19 4:00 FOMC議事要旨\n- 11/25 22:30 米PCE\n- 12/4 22:30 米11月雇用統計\n- 12/10 4:00 FOMC、同日22:30 米11月CPI\n- 12/17 22:15 ECB\n- 12/18 日銀(時刻未定)\n\n### E. 結論\n- **最も強気な業界:** 中期ではAIメモリーと半導体検査装置、足元の値動きではエネルギーです。\n- **最大の市場リスク:** AI投資への懐疑による半導体株の売りと、原油の120ドル超えが同時に起きることです。日経225は値がさの半導体株に依存しているため、下げが増幅されやすい構造です。\n- **注目企業5社:** アドバンテスト、東京エレクトロン、キオクシア、ソフトバンクG、NVIDIA。\n- **重要テーマ3件:** AI投資の採算とフリーキャッシュフロー、原油とホルムズ海峡と米中間選挙、米インフレと12月の利上げ観測です。\n- **見通しが好転する条件:** Apple・AMD・NVIDIAのガイダンスが予想を上回ること、米国とイランの和平が進んで原油が下がることです。\n- **見通しが悪化する条件:** 米CPIの上振れ、Brentの120ドル超え、日経平均がCME先物の水準(62,600円)を割り込んでさらに下げることです。\n- **副業(ストック型)のヒント:** 公式情報で確認した投資イベントカレンダーや決算要点のデータベースは、一度仕組みを作れば自動で更新でき、時間を切り売りしない資産型の副業に向きます。暗号資産の自己管理やセキュリティの入門ガイドのような、長く読まれる解説コンテンツも候補です。いずれも投資助言にならない範囲で行うことが前提です。\n\n**カレンダー:** 変更なしです。今後の主要イベントは正しい日時で登録済みで、日付が決まっていないAnthropicの上場の1件だけスキップしました。\n","summary":{"headline":"**日経225の今週の結果(確定):** 63,290.11円で、週間では+597円(+0.95%)でした。","lead":"上げ下げの大部分は少数の値がさ半導体株によるもので、市場全体の強さはそれほどでもありません(TOPIXは3,965.07、10/30は-0.95%)。","rest":"- **週明けの見通し(推定):** CME日経平均先物12月限は62,600円で引けました。大阪取引所の日中比で-890円、現物終値と比べると約-690円です。10/30の米ハイテク株の急落分が、11/2(月)の寄り付きに反映される可能性が高いと見ています。これは推定で、実際の寄与度ではありません。\n\n- **最大のリスク:** 二つの懸念が同時に進んでいます。一つは「AI投資が回収できず、現金を使い果たしているのでは」という見方で、Alphabet・Amazon・Intelの決算がきっかけです。もう一つはBrent原油の117ドル台への上昇で、11/3の米中間選挙の後にイランとの衝突が再燃する懸念が背景にあります。\n- **最も強気な業界(中期):** AIデータセンター向けのメモリーと半導体検査装置です。キオクシアは「来年の生産能力はほぼ売り切れ」と述べ、アドバンテストは業績予想を上方修正しました。ただ足元の株価は売られており、業績と株価の向きが一致していません。\n- **来週の焦点:** 11/3 7:00のApple決算と米中間選挙(11/3は文化の日で東京市場は休場)、11/4 7:00のAMD決算、11/6 22:30の米10月雇用統計です。","stats":[{"label":"日経平均","value":"+0.95%","dir":"up","sub":"63,290.11","tag":"週間"},{"label":"Nasdaq","value":"-2.86%","dir":"dn","sub":"25,437.00","tag":""},{"label":"S\u0026P500","value":"-1.82%","dir":"dn","sub":"7,580.07","tag":""},{"label":"SOX","value":"-7.2%","dir":"dn","sub":"","tag":""},{"label":"先物","value":"62,600円","dir":"flat","sub":"","tag":""}]}},{"date":"2026-10-30","title":"夜の戦略レポート 10/30(金)、前日からの変化点","type":"日次","conclusion":"3日続伸の流れが一日で崩れました。日経225は4日ぶりに反落し、63,290.11円(-1,369.36円、-2.12%)で引けています。","conclusion_full":"3日続伸の流れが一日で崩れました。日経225は4日ぶりに反落し、63,290.11円(-1,369.36円、-2.12%)で引けています。原因は、AmazonとIntelの決算で「AI過剰投資」への懸念が再び強まったことです。日銀は据え置きでしたが、物価2%到達を宣言して利上げ継続の姿勢を示しました。当面はAI関連の押し目を拾う局面というより、AI投資の採算をめぐる見方が揺れる局面と見ておくのが無難です(推測)。","markdown":"**夜の戦略レポート 10/30(金)、前日からの変化点**\n\n**結論:** 3日続伸の流れが一日で崩れました。日経225は4日ぶりに反落し、63,290.11円(-1,369.36円、-2.12%)で引けています。原因は、AmazonとIntelの決算で「AI過剰投資」への懸念が再び強まったことです。日銀は据え置きでしたが、物価2%到達を宣言して利上げ継続の姿勢を示しました。当面はAI関連の押し目を拾う局面というより、AI投資の採算をめぐる見方が揺れる局面と見ておくのが無難です(推測)。\n\n**日経225の実際の寄与(確定)**\n- アドバンテスト・東京エレクトロン・ソフトバンクグループ・イビデンの4銘柄だけで、約1,100円以上押し下げました(日経報道)。TOPIXは3,965.07(-0.95%)で、下げの大半は値がさ半導体株によるものです。\n- イビデンは好決算にもかかわらず、Intelの決算を受けてストップ安(-15.2%)でした。不動産・小売・医薬品といったディフェンシブ株は上昇し、資金がそちらへ移っています。\n\n**決算**\n- **Amazon(確定値):** EPSは1.89ドル(予想1.96)、売上は2,019億ドル(予想2,023億)と、どちらも予想に届きませんでした。AWSは+39%で予想を上回っています。一方、過去12か月のフリーキャッシュフローは-424億ドル、四半期の設備投資は773億ドルに膨らみ、2026年の設備投資計画2,200億ドルは据え置きです。10〜12月期の売上ガイダンスも中央値が予想を下回り、株価は時間外で-6〜7%でした。\n- **Intel:** 10〜12月期のガイダンス(EPS 0.25ドル、売上150〜160億ドル)が予想(0.43ドル、171億ドル)を大きく下回り、時間外で-21%でした。PC需要の鈍化とメモリーコストの上昇が理由です。\n- **東京エレクトロン:** 通期予想を初めて開示しました(売上3.7兆円、営業利益1.169兆円)。1,500億円の自社株買いも発表しています。来週の株価の下支えになるかが注目点です。キオクシアの決算内容は、まだ確認できていません。\n\n**日銀**\n政策金利は1.25%で据え置きました(賛成8・反対1で、高田委員は1.5%への利上げを提案)。基調物価が2%と「おおむね整合的」になったと初めて表明し、ETFの売却ペースも加速させています。植田総裁は2%の定着には「まだ至っていない」と話しつつ、利上げは続ける方針です。10年国債利回りは2.770%(-0.065%)に下がりました。\n\n**原油**\nBrent12月限は117ドル台です。ホルムズ海峡でタンカーが攻撃されたほか、米国の中間選挙後にイラン攻撃が再開されるとの観測があります。10月の上昇率は約+14%になる見込みです。カタールの仲介は続いていますが、合意できるかは不透明です。\n\n**見通しが変わる条件:** 来週は、11/3(火)7:00 JSTのApple決算(新CEOターナス氏の初の決算説明会)、同日の米中間選挙、11/4のAMD決算、11/6の米雇用統計が続きます。半導体株が持ち直すかは、AMDの決算と、東京エレクトロンの自社株買いで買いが入るかにかかっています。中間選挙の後に米国がイランへの攻撃を再開した場合は、原油高と半導体安が重なる最悪の組み合わせになります(推測)。\n\n**カレンダー:** 変更なしです。`zhishujitian89@gmail.com` のprimaryで照合し、Apple、中間選挙、AMD、雇用統計など今後の主要イベントはすべて登録済みでした。\n\n朝の市場分析の定期実行は、まだ一時停止のままです。再開が必要でしたらお知らせください。\n","summary":{"headline":"3日続伸の流れが一日で崩れました。","lead":"日経225は4日ぶりに反落し、63,290.11円(-1,369.36円、-2.12%)で引けています。原因は、AmazonとIntelの決算で「AI過剰投資」への懸念が再び強まったことです。","rest":"日銀は据え置きでしたが、物価2%到達を宣言して利上げ継続の姿勢を示しました。当面はAI関連の押し目を拾う局面というより、AI投資の採算をめぐる見方が揺れる局面と見ておくのが無難です(推測)。","stats":[{"label":"TOPIX","value":"-0.95%","dir":"dn","sub":"3,965.07","tag":""}]}},{"date":"2026-10-29","title":"夜の戦略レポート 10/29(木)、前日からの変化点","type":"日次","conclusion":"日経平均は3日続伸で、AI半導体主導の戻りが続いています。","conclusion_full":"日経平均は3日続伸で、AI半導体主導の戻りが続いています。ただし今夜の米PCE・GDP・ECB、米引け後のAmazon・Intel決算、明日の日銀と材料が重なるので、方向が決まるのはこれらを通過してからです。","markdown":"**夜の戦略レポート 10/29(木)、前日からの変化点**\n\n**結論の更新:** 日経平均は3日続伸で、AI半導体主導の戻りが続いています。ただし今夜の米PCE・GDP・ECB、米引け後のAmazon・Intel決算、明日の日銀と材料が重なるので、方向が決まるのはこれらを通過してからです。\n\n**日経225(確定値)**\n- 終値は64,659.47円(+705.28円、+1.10%)、TOPIXは4,003.28(+0.29%)です。アドバンテストが前日に出した上方修正だけで約450円押し上げており、確定した寄与度で見ると、今回も指数の幅が狭い上げです。午前にサムスン決算を受けてKOSPIが下げた場面では日経も一時マイナスでしたが、後場は先物買いで持ち直しました。\n\n**決算**\n- **サムスン電子:** チップ利益は前年比15倍でしたが、新しい株主還元策がなく株価は-4%でした。2026年の設備投資を60%超増やし、2027年分の高性能チップは完売していると発表しています。HBMや製造装置の需要が強いことを裏付ける材料です。\n- **Alphabet:** 米国の寄り前に-10%で、EPS 2.12ドル(予想3.03ドル)と大きく未達でした。クラウドだけが上振れです。Microsoftは寄り前に+3.6%です。\n- **国内:** イビデンは通期の純利益予想を840億円から890億円に上げ(コンセンサスは877億円)、AIサーバー向け基板に約1,510億円を投資すると発表しました。キーエンスは7〜9月期の経常利益が+48%で、株式分割を調整すると配当を実質18%増やしています。\n\n**政策・地政学**\n- ECBのラガルド総裁が、2027年2月7日に任期途中で退任することが分かりました。\n- 米政府がイランと暫定的な和平合意を交渉中だとSemaforが報じ、Brentは-1%前後です。ただし障害は大きいとされ、確定ではありません。\n\n**今夜と明日のチェックポイント**\n- 今夜21:30 JSTに米9月PCEとQ3 GDP速報が出ます(コンセンサスはコアPCE前年比3.1%、GDP年率3.2%)。\n- 22:15にECBが発表します。据え置きの予想です。\n- 明朝6:00ごろにAmazonとIntelが決算を出します。\n- 明日10/30は日銀会合です。据え置きの予想で、12月の利上げにどこまで含みを持たせるかが焦点です。発表時刻は決まっていません。15:30からは総裁会見、その後に東京エレクトロン・キオクシア・SCREEN・TDKの決算が続きます。\n\n**見通しが変わる条件:** PCEが上振れして米10年債が5%台で一段と上昇する場合や、Amazonの設備投資やAWSの見通しが失望を招く場合は、半導体主導の上昇が崩れるリスクがあります。逆に、明日の東京エレクトロンとキオクシアの決算がアドバンテストに続いて強ければ、上昇が半導体以外に広がるかを見る局面に変わります。\n\n**カレンダー:** 変更なしです。今後の主要イベントは登録済みのものでカバーできています。\n\nなお、朝の市場分析の定期実行が「一時停止」になっています。私は止めていません。再開が必要なら、お知らせください。\n","summary":{"headline":"日経平均は3日続伸で、AI半導体主導の戻りが続いています。","lead":"ただし今夜の米PCE・GDP・ECB、米引け後のAmazon・Intel決算、明日 はすべて登録済みで、重複も日程変更もありませんでした。\n","summary":{"headline":"半導体・AIへの強気は一段と強まりました。","lead":"ただし、日経平均の上昇は一部の大型株に偏っています。今夜から明朝の山場は、FOMC(10/29 3:00 JST)とMicrosoft・Alphabetの決算です。","rest":"最大のリスクは、原油高(Brentが115ドル台)と米10年債利回り5%超が同時に進んでいることです。","stats":[{"label":"TOPIX","value":"-0.14%","dir":"dn","sub":"3,991.71","tag":""},{"label":"ドル円","value":"157.7円","dir":"fx","sub":"","tag":""}]}},{"date":"2026-10-27","title":"夜の戦略レポート 10/27(火)、前日からの変化点","type":"日次","conclusion":"1. 日経225は4日ぶりに反発し、終値は63,268.37円(前日比+1,078.72円、+1.73%)でした。","conclusion_full":"1. 日経225は4日ぶりに反発し、終値は63,268.37円(前日比+1,078.72円、+1.73%)でした。TOPIXは+0.61%の3,997.37にとどまったので、値がさの半導体株が主導した上昇です。アドバンテストは一時10%高になりました。個別銘柄の寄与度の正確な数値は、まだ取れていません。\n2. 材料はAnthropicの上場申請書類(S-1)の公開です。ただ、AI投資が回収できるかの本当の確認は、明日10/28 15:30のアドバンテスト決算と、10/29早朝のMicrosoft・Alphabet決算です。設備投資とクラウドの伸びが確認できなければ、今日の反発は一時的に終わる可能性があります(推測)。\n3. 最大のリスクは変わらず原油高です。ブレントは1バレル110ドル近辺で、イスラエル総選挙は今日が投票日です。原油高はインフレを通じて米国の利上げにつながります。今週のFOMCでの利上げ確率は約10%(CME)ですが、12月の0.25%利上げは織り込まれつつあり、米10年債利回りは4.986%と5%目前です。","markdown":"**夜の戦略レポート 10/27(火)、前日からの変化点**\n\n**結論の更新**\n1. 日経225は4日ぶりに反発し、終値は63,268.37円(前日比+1,078.72円、+1.73%)でした。TOPIXは+0.61%の3,997.37にとどまったので、値がさの半導体株が主導した上昇です。アドバンテストは一時10%高になりました。個別銘柄の寄与度の正確な数値は、まだ取れていません。\n2. 材料はAnthropicの上場申請書類(S-1)の公開です。ただ、AI投資が回収できるかの本当の確認は、明日10/28 15:30のアドバンテスト決算と、10/29早朝のMicrosoft・Alphabet決算です。設備投資とクラウドの伸びが確認できなければ、今日の反発は一時的に終わる可能性があります(推測)。\n3. 最大のリスクは変わらず原油高です。ブレントは1バレル110ドル近辺で、イスラエル総選挙は今日が投票日です。原油高はインフレを通じて米国の利上げにつながります。今週のFOMCでの利上げ確率は約10%(CME)ですが、12月の0.25%利上げは織り込まれつつあり、米10年債利回りは4.986%と5%目前です。\n\n**今日の新しい事実**\n- **Anthropic**(10/26にS-1提出、Nasdaqでティッカー「ANT」予定): 2026年上半期の売上は163億ドル(前年同期は約12億ドル)でした。純損失は807億ドルですが、うち724億ドルは転換社債などの評価替えによる非現金の費用です。営業損失は6.93億ドルまで縮小し、会社が示す調整後の営業利益は16億ドルの黒字です。上場日と価格帯は未定です。「11/16の週に上場、評価額1.5〜2兆ドル」という報道は匿名情報源に基づくもので、会社は確認していません。\n- **信越化学**(確定値): 上期の売上は1兆4,207億円(+10.6%)、営業利益は3,859億円(+15.6%)でした。7〜9月期の営業利益は+27%で、営業利益率は28.0%です。通期予想(営業利益7,000億円)は据え置き、社長は「生産はフル稼働」と述べています。AI向けシリコンウエハーの需要は堅調です。\n- **キヤノン**: 通期の営業利益予想を4,650億円から4,560億
